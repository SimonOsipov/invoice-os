name: Preview Teardown (delete this PR's preview)

on:
  pull_request:
    types: [closed]

# Shared with dev-env.yml: the teardown waits for an in-flight deploy of the same PR.
concurrency:
  group: dev-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    name: Delete the preview of PR ${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The head SHA: GitHub deletes the merge ref when the PR closes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/428987361227/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: deploy-preview@ascomply-preview.iam.gserviceaccount.com
      - name: Delete the services, job, database, bucket and secrets
        env:
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/preview.sh teardown "$PR"
