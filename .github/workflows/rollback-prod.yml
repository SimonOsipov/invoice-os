# Rollback of production on Google Cloud (GKE-09 AC7), started by the user: every service goes back
# to the revision that served before the last deploy (tagged `rollback` by deploy-prod.yml).
# Migrations stay applied; they are expand-only. The next deploy sends traffic to its new revisions.
name: Roll back production (GCP)

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back every service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ascomply-prod
      REGION: africa-south1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/428987361227/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: deploy-prod@ascomply-prod.iam.gserviceaccount.com
      - name: Move traffic to the rollback revisions
        run: bash scripts/ci/gcp-traffic.sh rollback moved.txt
      - name: Record the move
        if: always()
        run: |
          {
            echo "| Service | From | To |"
            echo "|---|---|---|"
            while read -r svc from to; do echo "| $svc | $from | $to |"; done < moved.txt
          } >>"$GITHUB_STEP_SUMMARY"
