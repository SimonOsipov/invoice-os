name: Dev Env (deploy full fleet + verify)

# Deploy the whole fleet to one Railway environment, then verify it.
# A ready PR → its own ephemeral env, which THIS workflow forks from
# the persistent environment (M4-23-03) — not Railway's PR Environments feature,
# which is OFF and stays OFF. push to `main` and workflow_dispatch → the
# PERSISTENT environment itself (M4-22-07 dropped reset-seed/E2E).
#
# persona-handoff-fix, Decision [pr-only-reset]: a PR's forked Postgres inherits
# development's live data, not an empty schema, so it also inherits every
# business_entities/invoices row any E2E run has ever left behind (measured on
# pr-110: 90 companies, ~3,090 invoices, most of it residue). THIS DOES NOT
# REVERSE M4-22-07 above — that removal was scoped to the push/workflow_dispatch
# path, whose target is the PERSISTENT environment (resetting it would destroy
# live data with no fork underneath it). The reset added here is a NEW,
# separately-gated step invoked from inside the gateway's own boot sequence
# (internal/platform/db.Provision, between MigrateUp and Seed — no new job in
# this file), reachable ONLY for a genuine PR fork: it requires
# RAILWAY_ENVIRONMENT_NAME (Railway-injected, never forked-as-a-value — see
# docs/topology-e2e.md) to match a PR-environment name, which excludes
# "development"/"production" unconditionally, AND a dedicated
# GATEWAY_DB_RESET=true variable set on the gateway service. See
# db.ResetEnabled's doc comment (internal/platform/db/reset.go) for the full
# gating rationale, including why it deliberately does NOT reuse ENVIRONMENT/
# GATEWAY_DB_BOOTSTRAP the way the existing seed gate does.
#
# DEMO-04 adds a SECOND destructive step: the demo-tenant purge
# (internal/platform/db/demopurge.go), between the reset and the seed. It is gated
# like the seed, by ENVIRONMENT and GATEWAY_DB_BOOTSTRAP (db.BootstrapEnabled),
# and reaches only the four seeded demo tenants (db.DemoTenants). A fork's gateway
# gets ENVIRONMENT=development from set-fork-environment, so it purges.
# Production's gateway reads ENVIRONMENT=production, set once by hand with
# railway-env.sh set-production-environment, so it does not.
#
# THE TARGET DISCRIMINATOR IS `github.event_name == 'pull_request'`, NOT
# `!= 'workflow_dispatch'`. Only a PR targets an ephemeral fork; push and
# dispatch both target the persistent environment, whose variables and domains
# are the SOURCE OF TRUTH and must never be reconciled/overwritten. Guarding on
# `!= workflow_dispatch` would let a push run `reconcile-urls` against the live
# environment, overwriting VITE_GATEWAY_URL / CORS_ALLOWED_ORIGINS with hosts
# that `urls` merely discovered. `urls` below now PREFERS the custom domain, so
# today that write would land the same api./app./www.ascomply.com values back.
# That is coincidence, not protection: a push must never write live env vars,
# and one service lacking a custom domain restores the original damage.
#
# The persistent environment is addressed by ID, never by name: it was renamed
# `development` -> `production` on 2026-07-27, which silently broke the
# dispatch path (`railway up --environment development` -> `Environment
# "development" not found`). The ID is already the constant that both
# dev-env-teardown.yml and dev-env-sweeper.yml key their never-delete guards on.
#
# Auth: PR and push runs use RAILWAY_API_TOKEN (account-scoped, `Authorization:
# Bearer`); workflow_dispatch uses RAILWAY_API_DEV_TOKEN (project token,
# `Project-Access-Token` header). An account token would cover all three —
# collapsing them is an open cleanup. Account tokens carry no implicit scope, so
# every call names --project / --environment explicitly.
#
# Human-applied prerequisites (see docs/topology-e2e.md):
#  - Railway PR Environments are OFF and MUST STAY OFF (M4-23-02) — do NOT turn
#    them on. They never worked here (Railway is not subscribed to this repo's PR
#    events), and railway-invariants.yml now fails every PR if they are re-enabled
#    or if any deployment trigger appears. See docs/deploy-model.md.
#  - RAILWAY_API_TOKEN from Account Settings → Tokens, NOT Project Settings:
#    a project token is pinned to one env and cannot reach a PR env.
#  - Railway Watch Paths empty on all 15 non-Postgres services, or `railway up`
#    silently skips untouched services and a torn-down fleet never recovers.
#    prepare-env asserts this at runtime. Re-clear if a service is recreated.
#  - RAILWAY_* IDs in `env:` below are stable; update them if a resource is
#    ever deleted and recreated. Domain suffixes are opaque — always discovered,
#    never hardcoded.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merging to `main` deploys the persistent environment, so what is live is
  # what is on `main`. Before this, NOTHING deployed on merge: a PR deployed to
  # its own ephemeral env, dev-env-teardown.yml deleted that env on close, and
  # the persistent env kept serving whatever was last dispatched by hand — it
  # sat 3 merged PRs / 16 commits stale before anyone noticed.
  #
  # `paths-ignore`, NOT the `changes` job's `e2e` filter, and deliberately: this
  # trigger's job is to keep the live environment converged on `main`, so its
  # failure direction must be an unnecessary deploy, never a missed one. A
  # duplicated allowlist would drift from that filter and silently
  # reintroduce exactly the staleness this trigger exists to prevent.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# M4-21-09: each PR now deploys to its OWN ephemeral Railway environment, so
# two different PRs must run FULLY IN PARALLEL rather than queueing behind
# each other — the whole point of per-PR environments (Core AC 4/5). The
# group is keyed by PR number, so it is UNIQUE per PR: two different PRs'
# numbers never collide (their groups differ → both run at once), and a
# second push to the SAME PR queues behind (never cancels) an in-flight
# deploy of that SAME PR. A workflow_dispatch or push run has no PR number and
# falls back to `github.ref` — `refs/heads/main` for both — so every run that
# targets the PERSISTENT environment lands in ONE shared group and serializes
# against the others. That is the desired behaviour, not a limitation: two
# concurrent runs would otherwise `railway up` the same services into the same
# environment. With `cancel-in-progress: false`, a burst of merges queues and
# deploys in order rather than racing, so the live environment converges on the
# last commit merged instead of on whichever build happened to finish last.
concurrency:
  group: dev-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read   # await-ci and ci-watch read the CI check-run status on this commit

env:
  # Stable Railway resource identifiers — see PREREQUISITES #6 above. NOT the
  # opaque generated domain strings (those are discovered fresh by
  # prepare-env below, never hardcoded — F7).
  RAILWAY_PROJECT_ID: 9ce6caf1-8c9b-4c77-b40d-3d6f1efa48a3
  RAILWAY_DEV_ENVIRONMENT_ID: 6c864094-6a06-452f-8495-be77d8a94fe7
  RAILWAY_SVC_GATEWAY_ID: 951fff95-e881-4838-878f-0626a4c44693
  RAILWAY_SVC_APP_ID: cb4a38ca-4440-4a0a-892e-c01d8013bb9a
  RAILWAY_SVC_LANDING_ID: 21e62d5d-82c9-48d8-8f6b-b2a53104c046
  RAILWAY_SVC_OPS_CONSOLE_ID: 00df2247-ee57-4722-a663-c7d3a29e2cdd
  RAILWAY_SVC_SUPPORT_CONSOLE_ID: 33a90fdc-a812-4807-837c-9c62593d6f41
  # M4-21-10: the Postgres service id (recorded in docs/migrations.md's provisioning
  # Appendix) — same stable-resource-id pattern as above. No CI job resolves
  # a DSN with it anymore (M4-22-08); railway-env.sh still uses it for the Postgres volume.
  RAILWAY_SVC_POSTGRES_ID: 98723af0-50ca-42a4-a56a-3e0438b9ce8a

jobs:
  # Decides whether this PR needs the deploy chain; `E2E gate` passes a PR it marks not relevant.
  # A skipped or renamed filter yields '', which the gate fails (e2e/mergeGate.ts).
  changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'packages/**'
              - 'e2e/**'
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'db/**'
              - 'tools/prenv/**'
              # M4-23-08: the create/reconcile/teardown/sweep logic lives here now, so a PR
              # touching it must fire the gate that validates it.
              - 'scripts/ci/**'
              # EXTR-03-08: without this a Python-only PR merges green having deployed nothing
              # (TestWorkflows_SidecarPathsAreFiltered). Widening this list only changes WHEN the
              # deploy runs. What fails closed on an absent service is expected_json, which this
              # does not touch.
              - 'sidecar/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.dockerignore'
              - 'Caddyfile'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/dev-env.yml'

  # A push waits for green CI before any deploy; a PR deploys alongside CI. On a PR, a red CI
  # makes ci-watch cancel the run, and e2e needs it. workflow_dispatch bypasses both.
  await-ci:
    name: Await green CI (push)
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the CI check to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/await-ci.sh "$SHA"

  ci-watch:
    name: Watch CI (PR; red CI stops the run)
    needs: [changes]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: write
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
      - id: wait
        name: Wait for the CI check to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/await-ci.sh "$SHA"
      - name: Stop this run on a red CI
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPO"

  # 0.5. Prepare the target Railway environment (M4-23-03). On a PR we now
  #      CREATE the environment ourselves rather than waiting for Railway to
  #      make one for us: `prenv name <pr>` derives `pr-<N>` (the single name
  #      constructor in this repo, M4-23-01), and `railway-env.sh
  #      ensure-environment` reuses it if it already exists or forks it from
  #      `development` otherwise. Idempotent, so a re-run of the same PR
  #      mutates nothing. There is no polling here and no dependence on
  #      Railway's PR Environments feature, which never worked in this project
  #      (M4-23-02) and must stay OFF. On workflow_dispatch, the target is
  #      always the persistent `development` environment (its id is a stable,
  #      hardcoded constant — PREREQUISITES #6) and the create path is
  #      structurally unreachable. Either way, this job also asserts every
  #      non-Postgres service instance still has empty Watch Paths
  #      (PREREQUISITES #5) and discovers the 5 public URLs fresh (F7) — the
  #      hardcoded workflow-level `env:` URLs this superseded are GONE; every
  #      consumer below reads `needs.prepare-env.outputs.*` instead.
  prepare-env:
    name: Prepare Railway environment (create-or-reuse + assert Watch Paths + discover URLs)
    # `push` is named explicitly rather than left to fall through
    # `github.event.pull_request.draft == false`. On a push that expression is
    # `null == false`, which GitHub's loose comparison coerces to true — correct
    # by accident, via a coercion rule no reader should have to know.
    needs: [changes]
    if: >-
      ( always() &&
        ( github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' ||
          github.event.pull_request.draft == false ) ) &&
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Raised 10 -> 20 by M4-23-04. The seam now creates the Postgres volume and
    # brings Postgres up in a fresh fork, waiting for it (<=420s). At 10
    # minutes a slow-but-CORRECT fork would die as a bare job-level timeout with
    # no annotation naming a cause — the exact failure mode the seam exists to
    # prevent. A job knob, not a restructure.
    timeout-minutes: 20
    outputs:
      # `environment` is what `railway up --environment` consumes: a name for an
      # ephemeral PR fork, the ID for the persistent environment (see `resolve`).
      environment: ${{ steps.resolve.outputs.environment }}
      environment_id: ${{ steps.resolve.outputs.environment_id }}
      # Display only. Empty on the PR path, where `environment` is already the
      # readable `pr-<N>`; consumers fall back to it.
      environment_label: ${{ steps.resolve.outputs.environment_label }}
      gateway_url: ${{ steps.urls.outputs.gateway_url }}
      app_url: ${{ steps.urls.outputs.app_url }}
      landing_url: ${{ steps.urls.outputs.landing_url }}
      ops_console_url: ${{ steps.urls.outputs.ops_console_url }}
      support_console_url: ${{ steps.urls.outputs.support_console_url }}
    steps:
      - uses: actions/checkout@v4
      # Still required: `prenv name` is the ONLY environment-name constructor in
      # this repo (M4-23-01) and this step is a shell, so it must shell out to Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve target environment (create-or-reuse)
        id: resolve
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail

          # The persistent-environment short-circuit lives HERE, in the YAML, and
          # not in railway-env.sh, because it is a POLICY statement — the
          # persistent environment must never be created, forked over, or made
          # ephemeral ([development-not-ephemeral]) — and it belongs at the point
          # a reader looks for it. On this path the script is never invoked at
          # all, so environmentCreate is not merely guarded, it is unreachable.
          #
          # Taken by BOTH push-to-main and workflow_dispatch. Only a PR gets an
          # ephemeral fork.
          #
          # `environment` is emitted as the ID, not the name. It is consumed as
          # `railway up --environment`, which accepts either (verified against
          # CLI 4.66.0), and the ID cannot be invalidated by a rename — the name
          # can, and was: `development` -> `production` on 2026-07-27 turned every
          # dispatch deploy into `Environment "development" not found`. The
          # human-readable name is carried separately for display only.
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] || [ "$GH_EVENT_NAME" = "push" ]; then
            echo "$GH_EVENT_NAME — targeting the persistent environment $RAILWAY_DEV_ENVIRONMENT_ID; environmentCreate is unreachable on this path."
            {
              echo "environment=$RAILWAY_DEV_ENVIRONMENT_ID"
              echo "environment_id=$RAILWAY_DEV_ENVIRONMENT_ID"
              echo "environment_label=persistent env"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(go run ./tools/prenv name "$PR_NUMBER")
          echo "PR #$PR_NUMBER -> environment name '$name'"
          bash scripts/ci/railway-env.sh ensure-environment "$name"

      # --- STEP SEAM (M4-23-04) ---------------------------------------------
      # Fork reconciliation is inserted HERE, between `resolve` and `urls`, as a
      # pure insertion: `urls` DISCOVERS the 4 public domains and fails if any is
      # missing, so anything that has to make them exist must run before it and
      # after the environment exists. Do not merge these into either neighbour.
      #
      # Every step in the seam runs on `pull_request` ONLY — skipped on both push
      # and workflow_dispatch. Load-bearing, not cosmetic, for two independent
      # reasons: (1) on those paths the target is the PERSISTENT environment,
      # which is not a fork and is the thing forks are reconciled *against*, so
      # reconciling it would rewrite live infrastructure (see the reconcile-urls
      # step below for the concrete damage); (2) railway-env.sh authenticates
      # with `Authorization: Bearer`, which the dispatch path's Railway PROJECT
      # token cannot satisfy. Drop the guard and every dispatch run breaks.
      # ----------------------------------------------------------------------

      # First after `resolve`: GoTrue must never boot a fork without its own key.
      # GOTRUE_SITE_URL waits for `urls` (set-fork-auth-site).
      - name: Write the fork's auth configuration (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-fork-auth "$ENV_ID"

      - name: Write the fork's gateway token (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-fork-gateway-token "$ENV_ID"

      - name: Audit sealed variables in the source environment (only the auth allowlist may be sealed)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash scripts/ci/railway-env.sh audit-sealed-variables

      # M4-22-FU. THIS is the load-bearing half: M4-22 was a rename in
      # `development`, so `development` is where it was visible. Placed BEFORE
      # reconcile-fork on purpose — `development` is persistent so there is no
      # materialisation race (the same reason the sealed-variable audit above is
      # safe), and this fails in ~10s rather than behind reconcile-fork's 420s
      # Postgres wait.
      - name: Assert DB DSNs in the source environment (M4-22 invariant)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash scripts/ci/railway-env.sh assert-db-dsns --source-only

      # PR ONLY. This mutates the target environment (domains, Postgres volume,
      # bucket) to make a fresh fork resemble its source, and blanks WAL_ARCHIVE_*
      # on its Postgres so the fork never archives into production's bucket. The
      # persistent environment is not a fork and is the thing being resembled —
      # reconciling it against itself is at best a no-op and at worst rewrites
      # live infrastructure.
      - name: Reconcile fork fidelity (domains, Postgres archive blank + volume + bring-up)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh reconcile-fork "$ENV_ID"

      - name: Assert Watch Paths are empty on all 15 non-Postgres services (M3-16 invariant)
        env:
          RAILWAY_API_TOKEN: ${{ github.event_name != 'workflow_dispatch' && secrets.RAILWAY_API_TOKEN || '' }}
          RAILWAY_PROJECT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_API_DEV_TOKEN || '' }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: |
          set -euo pipefail

          query_body=$(jq -n --arg e "$ENV_ID" \
            '{query: "query($e:String!){environment(id:$e){serviceInstances{edges{node{serviceName watchPatterns}}}}}", variables: {e: $e}}')

          # query prints its own ::error:: and exits non-zero on a failed call.
          resp=$(printf '%s' "$query_body" | bash scripts/ci/railway-env.sh query "reading serviceInstances for environment $ENV_ID")

          expected_json='["gateway","tenancy","portfolio","invoice","validation","submission","dashboard","notifications","reconciliation","docling","auth","landing","app","ops-console","support-console"]'

          missing=$(echo "$resp" | jq -r --argjson names "$expected_json" '
            ([.data.environment.serviceInstances.edges[]?.node.serviceName]) as $present
            | ($names - $present)[]?
          ')
          if [ -n "$missing" ]; then
            echo "::error::Expected service(s) not found in this environment's serviceInstances (renamed or missing?): $missing"
            exit 1
          fi

          offenders=$(echo "$resp" | jq -r --argjson names "$expected_json" '
            .data.environment.serviceInstances.edges[]?.node
            | select(.serviceName as $n | $names | index($n) != null)
            | select((.watchPatterns // []) | length > 0)
            | "\(.serviceName): \(.watchPatterns | join(", "))"
          ')
          if [ -n "$offenders" ]; then
            echo "::error::Non-empty Watch Paths found (M3-16 invariant violated) — railway up would SILENTLY SKIP these services on this run, reproducing the cold-fleet failure invisibly:"
            echo "$offenders"
            exit 1
          fi
          echo "All 15 non-Postgres service instances report empty Watch Paths."

      # M4-22-FU, the LOWER-VALUE half: the fork inherits development's
      # variables, which the step above the seam already checked, so this only
      # catches a fork-time rendering fault. Placed AFTER Watch Paths and not
      # earlier: that step queries all 15 service names and hard-fails if any is
      # missing, which is what proves the 8 context services and the `docling`
      # and `auth` sidecars have materialised.
      # settle_fork is NOT a sufficient barrier — it checks only the 6 service
      # ids reconcile-fork acts on (the RAILWAY_SVC_*_ID list in
      # require_service_ids, railway-env.sh), which excludes the 8 contexts and the sidecar.
      #
      # `pull_request` only, like the seam steps and for the same reasons: it
      # checks FORK fidelity, and assert-db-dsns authenticates `Authorization:
      # Bearer` only, which the dispatch path's Railway PROJECT token cannot
      # satisfy. Consequence: push and dispatch runs get NO DSN check — acceptable
      # because neither forks anything, so there is no fork-time rendering fault
      # to catch.
      - name: Assert DB DSNs in the fork environment (M4-22 invariant)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh assert-db-dsns "$ENV_ID"

      - name: Discover the 5 public URLs (never construct — F7)
        id: urls
        env:
          RAILWAY_API_TOKEN: ${{ github.event_name != 'workflow_dispatch' && secrets.RAILWAY_API_TOKEN || '' }}
          RAILWAY_PROJECT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_API_DEV_TOKEN || '' }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: |
          set -euo pipefail

          fetch_domain() {
            svc_id="$1"
            svc_label="$2"
            body=$(jq -n --arg p "$RAILWAY_PROJECT_ID" --arg e "$ENV_ID" --arg s "$svc_id" \
              '{query: "query($p:String!,$e:String!,$s:String!){domains(projectId:$p,environmentId:$e,serviceId:$s){customDomains{domain targetPort} serviceDomains{domain targetPort}}}", variables: {p: $p, e: $e, s: $s}}')

            if ! r=$(printf '%s' "$body" | bash scripts/ci/railway-env.sh query "discovering the $svc_label domain"); then
              return 1
            fi

            # select-domain owns the custom-first rule; guarded by its --self-test
            # fixtures. errexit is SUSPENDED in this function (called in a `|| exit 1`
            # list), so the refusal must be caught here or it emits `https://` hostless.
            if ! sel=$(echo "$r" | bash scripts/ci/railway-env.sh select-domain); then
              return 1
            fi
            count=$(echo "$sel" | jq -r '.count')
            if [ "$count" = "0" ]; then
              echo "::error::No domain found for $svc_label (service $svc_id) in environment $ENV_ID — neither a custom domain nor a Railway-generated one. Every public service must have at least one (docs/add-a-service.md step 6)." >&2
              return 1
            fi
            d=$(echo "$sel" | jq -r '.domain')
            echo "https://$d"
          }

          gateway_url=$(fetch_domain "$RAILWAY_SVC_GATEWAY_ID" gateway) || exit 1
          app_url=$(fetch_domain "$RAILWAY_SVC_APP_ID" app) || exit 1
          landing_url=$(fetch_domain "$RAILWAY_SVC_LANDING_ID" landing) || exit 1
          ops_console_url=$(fetch_domain "$RAILWAY_SVC_OPS_CONSOLE_ID" ops-console) || exit 1
          support_console_url=$(fetch_domain "$RAILWAY_SVC_SUPPORT_CONSOLE_ID" support-console) || exit 1

          {
            echo "gateway_url=$gateway_url"
            echo "app_url=$app_url"
            echo "landing_url=$landing_url"
            echo "ops_console_url=$ops_console_url"
            echo "support_console_url=$support_console_url"
          } >> "$GITHUB_OUTPUT"

          echo "gateway=$gateway_url app=$app_url landing=$landing_url ops-console=$ops_console_url support-console=$support_console_url"

      - name: Write the fork's auth site URL
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
          LANDING_URL: ${{ steps.urls.outputs.landing_url }}
        run: bash scripts/ci/railway-env.sh set-fork-auth-site "$ENV_ID" "$LANDING_URL"

      # Must run after `urls` (consumes the discovered values) and before any
      # service that bakes or reads them deploys.
      #
      # PR ONLY, and this is the sharpest edge in the file. The persistent
      # environment's URL variables are the SOURCE OF TRUTH; this step overwrites
      # them with whatever `urls` discovered. `urls` now PREFERS the custom
      # domain, so that write would currently land the same
      # api./app./www.ascomply.com values back — coincidence, not protection: one
      # service lacking a custom domain restores the *.up.railway.app rewrite, and
      # because Vite bakes VITE_* at BUILD time, the very next SPA deploy would
      # ship a bundle pointing at the wrong origin, with CORS reset to match.
      # Guarding on `!= workflow_dispatch` instead of `== pull_request` is exactly
      # how a push trigger would have done that silently on the first merge.
      - name: Point the fork's URL variables at the fork (never at the source env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
          GATEWAY_URL: ${{ steps.urls.outputs.gateway_url }}
          APP_URL: ${{ steps.urls.outputs.app_url }}
          LANDING_URL: ${{ steps.urls.outputs.landing_url }}
          OPS_CONSOLE_URL: ${{ steps.urls.outputs.ops_console_url }}
          SUPPORT_CONSOLE_URL: ${{ steps.urls.outputs.support_console_url }}
        run: |
          bash scripts/ci/railway-env.sh reconcile-urls \
            "$ENV_ID" "$GATEWAY_URL" "$APP_URL" "$LANDING_URL" "$OPS_CONSOLE_URL" "$SUPPORT_CONSOLE_URL"

      # PR ONLY: on push/dispatch the target
      # is the persistent environment, whose AI keys are an operator's
      # and must never be blanked by CI. No continue-on-error: a silent
      # failure would leave a PR environment holding a usable key.
      - name: Force AI and Jev fake mode and blank both AI keys in the fork (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-ai-fake "$ENV_ID"

      # PR ONLY: forks copy production's Sentry DSNs and token, and Vite bakes
      # VITE_* at build, so this must precede every deploy.
      - name: Blank every Sentry variable in the fork (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-sentry-off "$ENV_ID"

      # PR ONLY: a fork is reused per PR, so it never inherits a production write made after it was created.
      - name: Point the fork gateway at the reconciliation service (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-fork-reconciliation-url "$ENV_ID"

      # PR ONLY: a fork inherits production's ENVIRONMENT, and the gateway needs
      # `development` there to serve the mock issuer and seed.
      - name: Set the fork gateway's ENVIRONMENT to development (never in the persistent env)
        if: github.event_name == 'pull_request'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.resolve.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh set-fork-environment "$ENV_ID"

      # The call log lives in $RUNNER_TEMP, which the runner sets for every step.
      - name: Report Railway API calls
        if: always()
        run: bash scripts/ci/railway-env.sh report-api-calls

  # 1. Deploy the gateway FIRST — it is the fleet's single migrator (docs/
  #    migrations.md §2). `--ci` streams build logs then exits after the
  #    BUILD (health is gated separately below). Skipped for draft PRs. The
  #    GATEWAY_MOCK_ISSUER is an enable flag, not a URL, and forks fine; only
  #    a `-tags mockissuer` (PR) build honours it.
  #    CORS_ALLOWED_ORIGINS is set per-environment by prepare-env's
  #    `reconcile-urls`: measured in pr-67, a fork inherits development's list.
  deploy-gateway:
    name: Deploy gateway → ${{ needs.prepare-env.outputs.environment_label || needs.prepare-env.outputs.environment }}
    needs: [await-ci, prepare-env]
    # Push waits on await-ci, so a red `main` never deploys; a PR needs only prepare-env.
    # A PR run stops when ci-watch cancels it; push and dispatch keep always() semantics.
    if: >-
      ( !cancelled() || github.event_name != 'pull_request' ) &&
      needs.prepare-env.result == 'success' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( github.event_name == 'push' && needs.await-ci.result == 'success' ) ||
        ( github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false ) )
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.66.0
    # e2e compares this with its own attempt: the database reset runs only when this job runs.
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      # PR and push path — account-scoped token. RAILWAY_TOKEN must be ABSENT, not empty:
      # measured 2026-07-19 in ghcr.io/railwayapp/cli:4.66.0, RAILWAY_TOKEN='' alongside a
      # valid RAILWAY_API_TOKEN still fails "Unauthorized", and a ternary cannot omit an
      # env key. Hence two steps rather than one.
      - name: Stamp the build sha into the upload
        run: sh scripts/ci/stamp-build-sha.sh "${{ github.sha }}"
      - name: Stamp the mock issuer into the PR build
        if: github.event_name == 'pull_request'
        run: sh scripts/ci/stamp-mock-issuer.sh
      - name: railway up gateway (PR/push — account token)
        if: github.event_name != 'workflow_dispatch'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh gateway
        timeout-minutes: 15
      # Dispatch path — project token scoped to `development`. Proven working by real
      # deploys (runs 29508626447, 29317896755 on main). Unchanged deliberately.
      - name: railway up gateway (dispatch — project token)
        if: github.event_name == 'workflow_dispatch'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_DEV_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh gateway
        timeout-minutes: 15

  # 2. Schema-before-fleet barrier: the gateway migrates at boot and
  #    exits through platform.Fatal on a bad migration, so a green /healthz proves the schema is
  #    fully migrated — this is what the context services, the SPAs, and the
  #    reset/seed all wait behind. Also now the SOLE Postgres liveness proof
  #    (M4-22-08 removed the pg_isready probe) — Provision() runs to
  #    completion before the gateway's listener opens. Every step of it is
  #    fatal on error except the demo-tenant purge (DEMO-04), which logs at
  #    ERROR and continues to the seed: it is one transaction that rolls back
  #    whole, so a failed purge leaves the database exactly as it was, and
  #    crash-looping the fleet over it would be worse than a stale demo.
  health-gate:
    name: Gate on gateway /healthz (schema migrated)
    needs: [deploy-gateway, prepare-env]
    # The leading status function stops await-ci's skip (PR, dispatch) from cascading here;
    # on a PR it is `!cancelled()`, so ci-watch's cancel stops this job.
    if: ( !cancelled() || github.event_name != 'pull_request' ) && needs.deploy-gateway.result == 'success'
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
    steps:
      # Deleting a pr-<N> environment and recreating it under the same name hands the fork
      # back its OWN old hostnames, which the edge still binds to the deleted services: the
      # domain reads syncStatus ACTIVE and routes nowhere. Repair it before the 900s wait
      # below blames Postgres. Skipped on workflow_dispatch, which authenticates with a
      # project token the script's Bearer header does not speak.
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - name: Verify the gateway hostname routes (repair a dark domain)
        if: github.event_name != 'workflow_dispatch'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ needs.prepare-env.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh verify-gateway-domain "$ENV_ID"
      - name: Wait for gateway /healthz 200 on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Waiting for $GATEWAY_URL/healthz to report build $EXPECTED_BUILD ..."
          ok=0
          seen=""
          reset=""
          purge=""
          mock=""
          issuers=""
          # 900s (180 x 5s): EVERY environment is now a cold build of all 15
          # services (M4-23 per-PR environments, Decision
          # [gate-windows-provisional]) — cold is the norm now, not the
          # exception the old 360s window assumed. Widen further if the
          # first green cold run needs it.
          #
          # A 200 alone is NOT enough. `railway up --ci` returns after the build
          # and the OLD container keeps answering 200 for the whole rolling
          # deploy, so waiting on the status code alone let the schema barrier
          # pass against the PREVIOUS commit's gateway — and, because the
          # gateway is what runs the destructive PR-environment reset at boot,
          # that reset then landed after the downstream services had already
          # started. Measured 2026-08-03. The build field closes it.
          for _ in $(seq 1 180); do
            body=$(curl -fsS --connect-timeout 5 --max-time 10 "$GATEWAY_URL/healthz" 2>/dev/null || echo '')
            seen=$(printf '%s' "$body" | jq -r '.build // empty' 2>/dev/null || echo '')
            if [ -n "$seen" ] && [ "$seen" = "$EXPECTED_BUILD" ]; then
              # Read db_reset out of the SAME body that carried the matching
              # build. A second curl can land on a different container while a
              # rolling deploy is still in progress, which is the whole reason
              # the build field exists.
              reset=$(printf '%s' "$body" | jq -r '.db_reset // empty' 2>/dev/null || echo '')
              purge=$(printf '%s' "$body" | jq -r '.demo_purge // empty' 2>/dev/null || echo '')
              mock=$(printf '%s' "$body" | jq -r '.mock_issuer // empty' 2>/dev/null || echo '')
              issuers=$(printf '%s' "$body" | jq -r '.auth_issuers // empty' 2>/dev/null || echo '')
              echo "  gateway healthy on $seen (schema migrated; db_reset=${reset:-none}, demo_purge=${purge:-none}, mock_issuer=${mock:-none}, auth_issuers=${issuers:-none})"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::$GATEWAY_URL/healthz did not report build $EXPECTED_BUILD within 900s (last seen: '${seen:-none}'). An empty build means the gateway predates the /healthz build field or the stamp step did not run; a DIFFERENT build means the new container never replaced the old one. If /healthz never answered at all, this is also the ONLY Postgres liveness proof: most likely cause is Postgres reaching deployment SUCCESS with NO VOLUME attached — it keeps raw TCP open but never speaks the wire protocol, so the gateway's boot-time migration never completes. Verify reconcile-fork actually created the volume before assuming a generic gateway problem."
            exit 1
          fi

          # The reset barrier, asserted in both directions from one field.
          #
          # A PR environment is a FORK of the persistent environment's Postgres
          # VOLUME, so it is born holding every row that environment holds — the
          # gateway TRUNCATEs and re-seeds it at boot (Decision [pr-only-reset],
          # internal/platform/db/reset.go) and the E2E suites downstream assume
          # that happened. Both of that reset's inputs are hand-set Railway
          # variables (GATEWAY_DB_RESET on the gateway service, plus the
          # Railway-injected environment name) and BOTH fail closed and silent:
          # lose the variable when a service is recreated and every later run
          # tests against inherited residue with a green fleet and nothing red.
          # This is the only place that becomes visible.
          #
          # And the mirror image, on the push/dispatch path: db_reset must be
          # false against the PERSISTENT environment, whose data has no fork
          # underneath it to fall back to. db.ResetEnabled already excludes it by
          # environment-name shape; this is what would notice if that stopped
          # being true.
          if [ "$IS_PR" = "true" ]; then
            if [ "$reset" != "true" ]; then
              echo "::error::gateway is serving $EXPECTED_BUILD but reports db_reset='${reset:-none}' — the PR fork was NOT reset, so it still holds whatever the persistent environment's Postgres held when this environment was forked. 'none' means the gateway predates the /healthz db_reset field; 'false' means a guard said no: check GATEWAY_DB_RESET=true is still set on the gateway service (it fails closed and is lost when a service is recreated) and that RAILWAY_ENVIRONMENT_NAME is the pr-<N> shape db.ResetEnabled allowlists. Running E2E here would verify against residue."
              exit 1
            fi
          elif [ "$reset" = "true" ]; then
            echo "::error::gateway reports db_reset=true against the PERSISTENT environment. db.ResetEnabled is supposed to make that impossible by environment-name shape — its allowlist has been widened, or this run is not targeting the environment it thinks it is. The next boot TRUNCATEs live tenant data that has no fork underneath it."
            exit 1
          fi

          # The purge and mock-issuer barriers, directional like db_reset.
          # set-fork-environment sets a fork gateway's ENVIRONMENT to development,
          # so its purge runs and its tagged binary serves the mock issuer.
          # Production's gateway reads ENVIRONMENT=production, which
          # db.provisionableEnvironment refuses, and its binary is untagged.
          # "true" proves one purge transaction committed, not that the demo is right.
          if [ "$IS_PR" = "true" ]; then
            want_purge=true;  want_mock=on
          else
            want_purge=false; want_mock=absent
          fi
          if [ "$purge" != "$want_purge" ]; then
            echo "::error::gateway is serving $EXPECTED_BUILD but reports demo_purge='${purge:-none}', want '$want_purge'. 'error' means PurgeDemoTenants failed and Provision swallowed it (look for 'demo-tenant purge failed'). 'none' means the gateway predates the field. On a PR, 'false' means a guard said no: check GATEWAY_DB_BOOTSTRAP=true on the gateway and that set-fork-environment set ENVIRONMENT=development. On the persistent environment, 'true' means a purge ran against live data: its gateway ENVIRONMENT no longer reads 'production' (docs/deploy-model.md)."
            exit 1
          fi
          if [ "$mock" != "$want_mock" ]; then
            echo "::error::gateway is serving $EXPECTED_BUILD but reports mock_issuer='${mock:-none}', want '$want_mock'. On a PR, 'absent' means scripts/ci/stamp-mock-issuer.sh did not tag the build, and 'off' means ENVIRONMENT or GATEWAY_MOCK_ISSUER gated it off. On the persistent environment, anything but 'absent' means a tagged gateway binary was deployed there. 'none' means the gateway predates the field."
            exit 1
          fi
          # A fork trusts its mock and its own GoTrue; production trusts only its GoTrue.
          if [ "$IS_PR" = "true" ]; then want_issuers=2; else want_issuers=1; fi
          if [ "$issuers" != "$want_issuers" ]; then
            echo "::error::gateway is serving $EXPECTED_BUILD but reports auth_issuers='${issuers:-none}', want '$want_issuers'. On a PR, '1' means set-fork-auth did not write AUTH_ADDITIONAL_ISSUERS on the gateway. On the persistent environment, '2' means AUTH_ADDITIONAL_ISSUERS is set there and a second issuer is trusted. 'none' means the gateway predates the field."
            exit 1
          fi

          # Production serves neither mint route. The old container answers
          # (jwks 200, login 403) until the rolling deploy drains, so poll for 404.
          if [ "$IS_PR" != "true" ]; then
            for probe in "GET /.well-known/jwks.json" "POST /auth/login"; do
              method=${probe%% *}
              route=${probe#* }
              code=""
              for _ in $(seq 1 36); do
                code=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' -X "$method" "$GATEWAY_URL$route" || true)
                if [ "$code" = "404" ]; then
                  break
                fi
                sleep 5
              done
              if [ "$code" != "404" ]; then
                echo "::error::$method $route on $GATEWAY_URL answered $code, not 404, for 36 attempts 5s apart. The persistent gateway must serve no mint route; 000 means it never answered."
                exit 1
              fi
              echo "  $method $route answered 404"
            done
          fi

  # 3. Deploy the eight context services, the `docling` sidecar and `auth`, only after the
  #    gateway is healthy. They boot against the already-migrated schema and never run
  #    migrations. Skipped for draft PRs.
  deploy-context:
    name: Deploy ${{ matrix.service }} → ${{ needs.prepare-env.outputs.environment_label || needs.prepare-env.outputs.environment }}
    needs: [health-gate, prepare-env]
    # The draft check applies only where `draft` exists; push and dispatch pass.
    if: ( !cancelled() || github.event_name != 'pull_request' ) && needs.health-gate.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.66.0
    # Matrix outputs combine across legs; only the auth leg sets this one.
    outputs:
      auth_deployment_id: ${{ steps.up.outputs.deployment_id_auth || steps.up_dispatch.outputs.deployment_id_auth }}
    strategy:
      fail-fast: false
      matrix:
        service: [tenancy, portfolio, invoice, validation, submission, dashboard, notifications, reconciliation, docling, auth]
    steps:
      - uses: actions/checkout@v4
      # Two mutually-exclusive steps, not one ternary — see deploy-gateway above for the
      # measurement: an account token in RAILWAY_TOKEN fails, and an empty RAILWAY_TOKEN
      # fails too, so the PR path needs the key genuinely absent.
      - name: Stamp the build sha into the upload
        run: sh scripts/ci/stamp-build-sha.sh "${{ github.sha }}"
      - name: railway up ${{ matrix.service }} (PR/push — account token)
        id: up
        if: github.event_name != 'workflow_dispatch'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh ${{ matrix.service }}
        timeout-minutes: 15
      - name: railway up ${{ matrix.service }} (dispatch — project token)
        id: up_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_DEV_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh ${{ matrix.service }}
        timeout-minutes: 15

  # 4. Deploy the four SPAs in parallel, only after the gateway is healthy.
  #    Vite bakes VITE_* at BUILD time (frontend/*/Dockerfile), so these images
  #    ship whatever the service variables hold now — pointed at THIS environment
  #    by prepare-env's `reconcile-urls`.
  deploy-spas:
    name: Deploy ${{ matrix.service }} → ${{ needs.prepare-env.outputs.environment_label || needs.prepare-env.outputs.environment }}
    needs: [health-gate, prepare-env]
    # The draft check applies only where `draft` exists; push and dispatch pass.
    if: ( !cancelled() || github.event_name != 'pull_request' ) && needs.health-gate.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:4.66.0
    strategy:
      fail-fast: false
      matrix:
        service: [landing, app, ops-console, support-console]
    steps:
      - uses: actions/checkout@v4
      # Two mutually-exclusive steps, not one ternary — see deploy-gateway above for the
      # measurement: an account token in RAILWAY_TOKEN fails, and an empty RAILWAY_TOKEN
      # fails too, so the PR path needs the key genuinely absent.
      - name: Stamp the build sha into the upload
        run: sh scripts/ci/stamp-build-sha.sh "${{ github.sha }}"
      - name: railway up ${{ matrix.service }} (PR/push — account token)
        if: github.event_name != 'workflow_dispatch'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh ${{ matrix.service }}
        timeout-minutes: 15
      - name: railway up ${{ matrix.service }} (dispatch — project token)
        if: github.event_name == 'workflow_dispatch'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_DEV_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ needs.prepare-env.outputs.environment }}
        run: sh scripts/ci/railway-up-ci.sh ${{ matrix.service }}
        timeout-minutes: 15

  # 6. Post-deploy verification (a): the fleet /healthz gate. Poll the
  #    gateway's fleet-health roll-up until all 10 backends are green (they may
  #    cold-start after `up`); fail the run naming the culprit if any stays
  #    down.
  fleet-gate:
    name: Fleet /healthz gate (all 10 backends green)
    needs: [deploy-context, prepare-env]
    if: ( !cancelled() || github.event_name != 'pull_request' ) && needs.deploy-context.result == 'success'
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Poll gateway /healthz/fleet until all up on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          echo "Polling $GATEWAY_URL/healthz/fleet for build $EXPECTED_BUILD ..."
          code=000
          stale="(never polled)"
          # 600s (120 x 5s): every environment is now a cold build (M4-23 per-PR
          # environments, Decision [gate-windows-provisional]) — widened from 200s.
          #
          # up/down is not the whole question. Each service reports the commit it
          # was built from (scripts/ci/stamp-build-sha.sh -> platform.BuildSHA ->
          # /healthz -> this roll-up), and a rolling deploy keeps the PREVIOUS
          # container answering "up" throughout — so this waits for the fleet to
          # be both healthy AND the fleet under test. Without it the E2E suite
          # verifies whichever commit happens to be serving, which is how a
          # boot-time step could appear never to have run at all.
          for _ in $(seq 1 120); do
            code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/fleet.json -w '%{http_code}' "$GATEWAY_URL/healthz/fleet" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              stale=$(jq -r --arg b "$EXPECTED_BUILD" '[.services[] | select(.name != "auth" and .build != $b) | "\(.name)=\(.build // "none")"] | join(", ")' /tmp/fleet.json 2>/dev/null || echo 'unparseable')
              if [ -z "$stale" ]; then break; fi
            fi
            sleep 5
          done
          echo "--- fleet health (HTTP $code) ---"
          jq . /tmp/fleet.json 2>/dev/null || cat /tmp/fleet.json || true
          if [ "$code" != "200" ]; then
            echo "::error::fleet not all-green (HTTP $code). Down services:"
            jq -r '.services[] | select(.status != "up") | "  DOWN: \(.name) — \(.error // "unhealthy")"' /tmp/fleet.json 2>/dev/null || true
            exit 1
          fi
          if [ -n "$stale" ]; then
            echo "::error::fleet is healthy but not on $EXPECTED_BUILD after 600s — still serving: $stale. A 'none' build means that service predates the /healthz build field or its stamp step did not run; any other value means its new container never replaced the old one. Running E2E here would verify the wrong commit."
            exit 1
          fi
          echo "All 10 backends green on $EXPECTED_BUILD (auth reports no build)."

      # docling has no public domain, so the gateway's roll-up is CI's only route
      # to it. The step above already blocks on every service's build; this one
      # names the sidecar, so a stale sidecar reads as itself rather than as one
      # entry in a joined list. Short poll: the wait already happened above.
      - name: Gate on docling's build in the fleet roll-up
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          build=""
          for _ in $(seq 1 5); do
            if curl -sS --connect-timeout 5 --max-time 10 -o /tmp/docling.json "$GATEWAY_URL/healthz/fleet"; then
              build=$(jq -r '[.services[] | select(.name == "docling") | .build // "none"][0] // "absent"' /tmp/docling.json)
              if [ "$build" = "$EXPECTED_BUILD" ]; then break; fi
            fi
            sleep 5
          done
          if [ "$build" != "$EXPECTED_BUILD" ]; then
            echo "::error::docling reports build='${build:-unreachable}' but the commit under test is $EXPECTED_BUILD. 'absent' means the roll-up does not name docling at all — check DOCLING_URL is set on the gateway service and that probedServices (cmd/gateway/main.go) still carries it. 'none' means the image shipped without sidecar/docling/build.txt. Any other value means the sidecar's new container never replaced the old one."
            exit 1
          fi
          echo "docling is serving $EXPECTED_BUILD."

      # No if: a push must still report on|off, so a production build that stops
      # reporting fails here. auth lacks the sentry field.
      - name: Gate on the fleet's Sentry state
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          parsed=0
          for _ in $(seq 1 5); do
            if curl -sS --connect-timeout 5 --max-time 10 -o /tmp/sentry-fleet.json "$GATEWAY_URL/healthz/fleet" \
              && jq -e '.services | type == "array"' /tmp/sentry-fleet.json >/dev/null 2>&1; then
              parsed=1
              break
            fi
            sleep 5
          done
          if [ "$parsed" != 1 ]; then
            echo "::error::$GATEWAY_URL/healthz/fleet was unreachable or had no services list after 5 tries; the fleet's Sentry state is unknown."
            exit 1
          fi
          if [ "$IS_PR" = "true" ]; then want='["off"]'; direction='off'; else want='["on","off"]'; direction='on or off'; fi
          checked='[.services[] | select(.name != "auth")]'
          names=$(jq -r "$checked | map(.name) | join(\", \")" /tmp/sentry-fleet.json) || {
            echo "::error::the fleet roll-up has a services entry that is not an object; the Sentry state is unverified."
            exit 1
          }
          if ! jq -e "$checked | any(.name == \"gateway\")" /tmp/sentry-fleet.json >/dev/null 2>&1; then
            echo "::error::the fleet roll-up has no gateway entry (checked: ${names:-nothing}); the Sentry state is unverified."
            exit 1
          fi
          offenders=$(jq -r --arg b "$EXPECTED_BUILD" --argjson want "$want" "$checked"' | map(select(.build != $b or (.sentry | IN($want[]) | not)) | "\(.name)=\(.sentry // "none")@\(.build // "none")") | join(", ")' /tmp/sentry-fleet.json) || {
            echo "::error::the fleet roll-up has a services entry that is not an object; the Sentry state is unverified."
            exit 1
          }
          if [ -n "$offenders" ]; then
            echo "::error::want Sentry $direction on $EXPECTED_BUILD; offenders: $offenders"
            echo "::error::'none' means the service predates the sentry field, or is down (none@none): check it is up first. On a PR, 'on' means a DSN reached the fork: check set-sentry-off in prepare-env. Any other build means its new container never replaced the old one."
            exit 1
          fi
          echo "Sentry $direction on $EXPECTED_BUILD for: $names (auth exempt)."

      # A PR fork must deliver nothing to HubSpot or Resend; production must not be fake.
      - name: Gate on notifications' contacts delivery mode
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = "true" ]; then want="fake"; else want="real off"; fi
          mode=""
          # worst case 12s: 2 waves of probes x (/healthz + /readyz) x 3s
          for _ in $(seq 1 5); do
            if curl -sS --connect-timeout 5 --max-time 20 -o /tmp/contacts-fleet.json "$GATEWAY_URL/healthz/fleet" \
              && jq -e '.services | type == "array"' /tmp/contacts-fleet.json >/dev/null 2>&1; then
              mode=$(jq -r '[.services[] | select(.name == "notifications") | .contacts // "none"][0] // "absent"' /tmp/contacts-fleet.json)
              case " $want " in *" $mode "*) break ;; esac
            fi
            sleep 5
          done
          case " $want " in
            *" $mode "*) echo "notifications reports contacts=$mode." ;;
            *)
              echo "::error::notifications reports contacts='${mode:-unreachable}', want one of: $want. 'none' means it predates the contacts field; 'absent' means the roll-up does not name notifications. On a PR, anything but 'fake' means the fork could write to HubSpot or Resend: check RAILWAY_ENVIRONMENT_NAME is the pr-<N> shape. On a push, 'fake' means CONTACTS_FAKE is set on production."
              exit 1
              ;;
          esac

      # auth has no build stamp; its deployment status is the verdict for `railway up`.
      - name: Wait for the auth deployment
        env:
          AUTH_DEPLOYMENT_ID: ${{ needs.deploy-context.outputs.auth_deployment_id }}
          RAILWAY_API_TOKEN: ${{ github.event_name != 'workflow_dispatch' && secrets.RAILWAY_API_TOKEN || '' }}
          RAILWAY_PROJECT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.RAILWAY_API_DEV_TOKEN || '' }}
        run: bash scripts/ci/railway-env.sh wait-deployment auth "$AUTH_DEPLOYMENT_ID"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Dispatch carries only the project token, which cannot read variables.
      - name: Gate on the account-mail templates
        if: github.event_name != 'workflow_dispatch'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash scripts/ci/railway-env.sh check-mail-templates "${{ needs.prepare-env.outputs.environment_id }}"

      # Production serves the logo only after a push deploy.
      - name: Gate on the account-mail logo
        if: github.event_name == 'push'
        run: go run ./tools/prenv mail-logo-check

  # 6b. SPA build verdict on push/dispatch, where e2e does not run. Read-only: GET only,
  #     no domain repair (that stays in e2e).
  spa-build-gate:
    name: SPA build gate (push/dispatch)
    needs: [deploy-spas, prepare-env]
    if: always() && needs.deploy-spas.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPECTED_BUILD: ${{ github.sha }}
      APP_URL: ${{ needs.prepare-env.outputs.app_url }}
      LANDING_URL: ${{ needs.prepare-env.outputs.landing_url }}
      OPS_CONSOLE_URL: ${{ needs.prepare-env.outputs.ops_console_url }}
      SUPPORT_CONSOLE_URL: ${{ needs.prepare-env.outputs.support_console_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for SPA /health on the commit under test
        run: bash scripts/ci/wait-spa-builds.sh "$EXPECTED_BUILD" "$LANDING_URL" "$APP_URL" "$OPS_CONSOLE_URL" "$SUPPORT_CONSOLE_URL"

  # 7. Post-deploy verification (b), once the fleet is green and the SPAs are
  #    deployed: smoke (landing + both consoles render) and api (typed contract
  #    suite against the gateway) in `e2e`; topology (browser login + cross-tenant
  #    isolation) in the `topology` job after it. PR environments only
  #    (M4-22-07); the DB is self-seeded at gateway boot, never reset here.
  #
  #    EPHEMERAL ENVIRONMENTS ONLY — hence `== 'pull_request'`, which now
  #    excludes push as well as dispatch. The api suite is not read-only, so a run
  #    against the persistent environment would mutate live data. Merging does not lose
  #    coverage: this exact suite already ran against the PR's own environment,
  #    on the same commit, as the gate for merging it.
  e2e:
    name: E2E (smoke + api)
    needs: [fleet-gate, deploy-spas, prepare-env, deploy-gateway, ci-watch]
    if: >-
      !cancelled() &&
      needs.fleet-gate.result == 'success' &&
      needs.deploy-spas.result == 'success' &&
      needs.ci-watch.result == 'success' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # flaky-spec gate lists the PR's changed files
    env:
      FLAKY_JSON_DIR: ${{ github.workspace }}/e2e/flaky-results
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
      APP_URL: ${{ needs.prepare-env.outputs.app_url }}
      LANDING_URL: ${{ needs.prepare-env.outputs.landing_url }}
      OPS_CONSOLE_URL: ${{ needs.prepare-env.outputs.ops_console_url }}
      SUPPORT_CONSOLE_URL: ${{ needs.prepare-env.outputs.support_console_url }}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      app_url: ${{ steps.urls.outputs.app_url }}
      landing_url: ${{ steps.urls.outputs.landing_url }}
      ops_console_url: ${{ steps.urls.outputs.ops_console_url }}
      support_console_url: ${{ steps.urls.outputs.support_console_url }}
    steps:
      # "Re-run failed jobs" keeps deploy-gateway's output from an earlier attempt.
      - name: Refuse a re-run that skipped the gateway deploy
        id: attempt
        env:
          DEPLOYED_ATTEMPT: ${{ needs.deploy-gateway.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$DEPLOYED_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error::Re-run the whole workflow, not failed jobs — the database reset runs only when the gateway deploys. Gateway last deployed in attempt '${DEPLOYED_ATTEMPT:-none}'; this is attempt $RUN_ATTEMPT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: List the topology shards
        id: shards
        run: |
          shards="$(node e2e/topology/shards.ts)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # A domain record can exist, report syncStatus ACTIVE and still not route — see
      # railway-env.sh, "Domain reachability: a record is not a route". Repair that here,
      # before the wait below spends its whole 600s budget on a hostname the edge has no
      # route for. Publishes the post-repair URLs, which need not keep their old names.
      - name: Verify SPA hostnames route (repair a dark domain)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ needs.prepare-env.outputs.environment_id }}
        run: bash scripts/ci/railway-env.sh verify-spa-domains "$ENV_ID"
      # The topology shards run on other runners; hand them the post-repair URLs.
      - name: Publish the SPA URLs
        id: urls
        run: |
          {
            echo "app_url=$APP_URL"
            echo "landing_url=$LANDING_URL"
            echo "ops_console_url=$OPS_CONSOLE_URL"
            echo "support_console_url=$SUPPORT_CONSOLE_URL"
          } >> "$GITHUB_OUTPUT"
      - name: Wait for SPA /health on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: bash scripts/ci/wait-spa-builds.sh "$EXPECTED_BUILD" "$LANDING_URL" "$APP_URL" "$OPS_CONSOLE_URL" "$SUPPORT_CONSOLE_URL"
      - name: Install Chromium
        # !cancelled(): skipping this when the wait fails makes smoke report
        # `browserType.launch: Executable doesn't exist` for what is really an unreachable SPA.
        if: "!cancelled() && steps.attempt.outcome == 'success'"
        run: pnpm --filter @invoice-os/e2e exec playwright install --with-deps chromium
      - name: Smoke (landing + both consoles render)
        run: pnpm --filter @invoice-os/e2e test:smoke
      # Both suites write to the SAME e2e/playwright-report/. Park each report the
      # moment its suite ends, before the next one overwrites it.
      - name: Park the smoke report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-smoke
          fi
      - name: API E2E (typed contract suite)
        # !cancelled(): a red smoke step must not silently withhold the api
        # verdict (APPR-14 fix) — always() would also run this on a
        # cancelled workflow, which we don't want.
        if: "!cancelled() && steps.attempt.outcome == 'success'"
        # Finishes before the topology job starts (`needs: e2e`): it shares the
        # deployed database with topology. GATEWAY_URL comes from this job's `env:`
        # (needs.prepare-env.outputs.gateway_url — the seam reads it
        # directly) — no chromium needed (A6: the api config declares no
        # browser project). Does not touch the database directly (M4-22-05) --
        # PERF-03/04/05 now read over HTTP instead; api/db.ts is deleted.
        run: pnpm --filter @invoice-os/e2e test:api
      - name: Park the API report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-api
          fi
      # A retry-pass elsewhere stays a summary warning; in a spec this PR changed it fails.
      - name: Fail on a retry-pass in a spec this PR changed
        if: always() && steps.attempt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -euo pipefail
          gh api --paginate "$PR_FILES_API" --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          node e2e/flakyGate.ts "$FLAKY_JSON_DIR" "$RUNNER_TEMP/pr-files.txt"
      # `if: always()`, not `if: failure()`. A spec that fails and then passes on
      # its retry leaves this job GREEN, so the failure-only upload could never
      # capture the one case with no other evidence. Measured over the 7 most
      # recent green Dev Env runs: 5 contained a retry-pass across 6 specs, and
      # every one of those reports was discarded. flakyReporter names them in the
      # job summary; these artifacts are how you then read the trace.
      - name: Upload smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: e2e/report-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload API Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: e2e/report-api/
          if-no-files-found: ignore
          retention-days: 7

  # Each topology unit runs on its own runner after smoke + api; the map is in
  # e2e/topology/shards.ts. It reads the environment only, so it holds no Railway token.
  topology:
    name: E2E topology (${{ matrix.shard }})
    needs: [e2e, prepare-env, deploy-gateway]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: read   # flaky-spec gate lists the PR's changed files
    env:
      FLAKY_JSON_DIR: ${{ github.workspace }}/e2e/flaky-results
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
      APP_URL: ${{ needs.e2e.outputs.app_url }}
      LANDING_URL: ${{ needs.e2e.outputs.landing_url }}
      OPS_CONSOLE_URL: ${{ needs.e2e.outputs.ops_console_url }}
      SUPPORT_CONSOLE_URL: ${{ needs.e2e.outputs.support_console_url }}
    steps:
      # "Re-run failed jobs" keeps deploy-gateway's output from an earlier attempt.
      - name: Refuse a re-run that skipped the gateway deploy
        id: attempt
        env:
          DEPLOYED_ATTEMPT: ${{ needs.deploy-gateway.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$DEPLOYED_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error::Re-run the whole workflow, not failed jobs — the database reset runs only when the gateway deploys. Gateway last deployed in attempt '${DEPLOYED_ATTEMPT:-none}'; this is attempt $RUN_ATTEMPT."
            exit 1
          fi
      - name: Refuse empty target URLs
        id: targets
        run: |
          rc=0
          for v in GATEWAY_URL APP_URL LANDING_URL OPS_CONSOLE_URL SUPPORT_CONSOLE_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — the e2e job did not publish it."
              rc=1
            fi
          done
          exit "$rc"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @invoice-os/e2e exec playwright install --with-deps chromium
      - name: Topology (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @invoice-os/e2e test:topology --project="$SHARD"
      - name: Park the topology report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-topology
          fi
      # A retry-pass elsewhere stays a summary warning; in a spec this PR changed it fails.
      - name: Fail on a retry-pass in a spec this PR changed
        if: always() && steps.attempt.outcome == 'success' && steps.targets.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -euo pipefail
          gh api --paginate "$PR_FILES_API" --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          node e2e/flakyGate.ts "$FLAKY_JSON_DIR" "$RUNNER_TEMP/pr-files.txt"
      - name: Upload topology Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-playwright-report-${{ matrix.shard }}
          path: e2e/report-topology/
          if-no-files-found: ignore
          retention-days: 7

  # The required merge check: always reports on a PR, so a skipped E2E cannot read as a pass.
  e2e-gate:
    name: E2E gate
    needs: [changes, e2e, topology, ci-watch]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node e2e/mergeGate.ts
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RELEVANT: ${{ needs.changes.outputs.e2e }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TOPOLOGY_RESULT: ${{ needs.topology.result }}
          CI_RESULT: ${{ needs.ci-watch.result }}
          CI_CONCLUSION: ${{ needs.ci-watch.outputs.conclusion }}

  # NOTE: there is still no scale-down job here — teardown is a separate
  # workflow, .github/workflows/dev-env-teardown.yml (M4-23-05), which deletes
  # the WHOLE ephemeral environment via environmentDelete on PR close. It
  # declares the SAME per-PR concurrency group as this workflow
  # (`dev-preview-<N>`, see :63-65) with `queue: max`, so a teardown queued
  # behind an in-flight deploy of the same PR waits for it rather than deleting
  # the environment mid-deploy ([teardown-shares-deploy-lock]).
  #
  # It replaces the deleted dev-env-cleanup.yml (M4-21-11), which scaled 11
  # services to zero inside one SHARED environment — the wrong unit now that
  # each PR owns an environment ([teardown-deletes-environment],
  # [cleanup-workflow-returns] reverses [cleanup-workflow-deleted]). Railway's
  # own PR-Environment deprovisioning is NOT the mechanism and never was: that
  # feature is OFF here and never created anything (M4-23-02).
  #
  # Teardown is the FAST path, not the guarantee: a `closed` event that does
  # not fire leaves an orphan, so dev-env-sweeper.yml (M4-23-07) reconciles
  # ephemeral environments against PR state daily and is the authority
  # ([teardown-best-effort-sweeper-authoritative]).
  #
  # A workflow_dispatch run against `development` still stays up: `development`
  # is persistent ([dev-env-status]) and no workflow ever deletes it.
