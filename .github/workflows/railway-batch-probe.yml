name: Railway batch probe (INFRA-05-01, temporary)

# One-shot AC-1 probe on a probe-pr-<N> fork. Fires once, when the PR opens. Deleted by INFRA-05-08.
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/railway-batch-probe.yml']

env:
  RAILWAY_PROJECT_ID: 9ce6caf1-8c9b-4c77-b40d-3d6f1efa48a3
  RAILWAY_DEV_ENVIRONMENT_ID: 6c864094-6a06-452f-8495-be77d8a94fe7

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the probe environment
        id: name
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "name=probe-$(go run ./tools/prenv name "$PR_NUMBER")" >> "$GITHUB_OUTPUT"

      - name: Fork the probe environment
        id: env
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          NAME: ${{ steps.name.outputs.name }}
        run: bash scripts/ci/railway-env.sh ensure-environment "$NAME"

      - name: Run the probe
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.env.outputs.environment_id }}
        run: bash scripts/ci/railway-batch-probe.sh "$ENV_ID"

      - name: Delete the probe environment
        if: always() && steps.name.outputs.name != ''
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          NAME: ${{ steps.name.outputs.name }}
        run: bash scripts/ci/railway-env.sh delete-environment "$NAME"
