<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are also @imported by the vendored token package, but a CSS @import is
         render-blocking and serialised behind the sheet that contains it, which costs a
         visible FOUT on the serif. Preconnecting and linking them here starts both
         fetches in the document head; the @import then resolves from cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" />
    <title>ASComply Africa — Platform</title>
    <meta
      name="description"
      content="ASComply Africa Platform — create, validate, approve and transmit compliant invoices against Nigeria's MBS rule pack."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
