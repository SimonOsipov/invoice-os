<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Choose a new password · ASComply</title>
<link rel="icon" href="/emails/mark.png">
<style>
body{margin:0;padding:24px 16px;background:#faf8f2;font-family:Manrope,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#536b6d;line-height:1.5}
main{display:block;max-width:440px;width:100%;box-sizing:border-box;margin:48px auto 0;padding:32px;background:#fff;border-radius:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#0b3032}
h1{margin:24px 0 8px;font-size:22px;color:#0b3032}
p{margin:0 0 16px;font-size:15px}
label{display:block;margin:0 0 6px;font-size:14px;font-weight:700;color:#0b3032}
input[type=password]{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #c9d9d6;border-radius:7px;font-family:inherit;font-size:15px}
.hint{margin:6px 0 0;font-size:13px}
.alert{margin:0 0 16px;padding:10px 12px;border-radius:7px;border:1px solid oklch(55% .2 25 / .24);background:oklch(55% .2 25 / .07);color:#b53b3b;font-size:14px}
button{display:block;width:100%;margin:24px 0;padding:12px 16px;border:0;border-radius:7px;background:#f5bc88;color:#163c35;font-family:inherit;font-size:14px;font-weight:700;line-height:1.4;cursor:pointer}
.note{margin:0;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/emails/mark.png" width="36" height="36" alt=""><span>ASComply</span></div>
  <h1>Choose a new password</h1>
  <p>Enter a new password for your ASComply account. This signs you out everywhere.</p>
  {{.Alert}}
  <form method="post" action="/auth/reset-password">
    <input type="hidden" name="token" value="{{.Token}}">
    <input type="hidden" name="type" value="recovery">
    <label for="password">New password</label>
    <input type="password" name="password" id="password" autocomplete="new-password" minlength="6" maxlength="72" required>
    <p class="hint">6 to 72 characters.</p>
    <button type="submit">Set new password</button>
  </form>
  <p class="note">If you did not ask to reset your password, close this page. Your password stays the same.</p>
</main>
<script>{{.Script}}</script>
</body>
</html>
