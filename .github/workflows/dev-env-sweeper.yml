name: Preview Sweeper (delete previews whose PR is closed)

# Teardown is the fast path; a close event that never fired leaves a preview behind. This deletes
# a preview older than 24 h whose PR reads closed or merged. An unreadable PR state is skipped.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: dev-env-sweeper
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  sweep:
    name: Delete previews whose PR is closed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/428987361227/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: deploy-preview@ascomply-preview.iam.gserviceaccount.com
      - name: Sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! prs=$(bash scripts/ci/preview.sh prs); then
            echo "::error::Could not list the previews; the sweep did not run."
            exit 1
          fi
          cutoff=$(date -u -d '24 hours ago' +%s)
          failures=0
          {
            echo "## Preview sweep — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| PR | Created | Decision |"
            echo "|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          while read -r pr created; do
            [ -n "$pr" ] || continue
            decision=""
            if [ "$(date -u -d "$created" +%s 2>/dev/null || echo 0)" -gt "$cutoff" ]; then
              decision="kept: younger than 24 h"
            elif ! state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null); then
              decision="skipped: PR state unreadable"
              echo "::warning::PR #$pr: state unreadable; its preview is left alone."
            elif [ "$state" = OPEN ]; then
              decision="kept: PR open"
            elif bash scripts/ci/preview.sh teardown "$pr"; then
              decision="deleted: PR $state"
            else
              decision="DELETE FAILED: PR $state"
              failures=$((failures + 1))
            fi
            echo "PR #$pr ($created): $decision"
            echo "| #$pr | $created | $decision |" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$prs"
          [ "$failures" = 0 ] || { echo "::error::$failures preview(s) could not be deleted."; exit 1; }
