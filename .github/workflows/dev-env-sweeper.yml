name: Preview Sweeper (delete previews whose PR is closed)

# Teardown is the fast path. This deletes a preview older than 24 h, or a leftover database at any age, whose PR reads closed.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: dev-env-sweeper
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  sweep:
    name: Delete previews whose PR is closed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the Actions variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: bash scripts/ci/require-vars.sh GCP_WIF_PROVIDER
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deploy-preview@ascomply-preview.iam.gserviceaccount.com
      - name: Sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! prs=$(bash scripts/ci/preview.sh prs); then
            echo "::error::Could not list the previews; the sweep did not run."
            exit 1
          fi
          if ! dbs=$(bash scripts/ci/preview.sh databases); then
            echo "::error::Could not list the preview databases; the sweep did not run."
            exit 1
          fi
          for db in $dbs; do
            awk -v p="$db" '$1==p{f=1} END{exit !f}' <<<"$prs" || prs+=$'\n'"$db -"
          done
          cutoff=$(date -u -d '24 hours ago' +%s)
          failures=0
          {
            echo "## Preview sweep — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| PR | Created | Decision |"
            echo "|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          while read -r pr created; do
            [ -n "$pr" ] || continue
            decision=""
            if [ "$pr" = nightly ]; then
              decision="kept: the Nightly run deletes it"
            elif [ "$created" != - ] && [ "$(date -u -d "$created" +%s 2>/dev/null || echo 0)" -gt "$cutoff" ]; then
              decision="kept: younger than 24 h"
            elif ! state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null); then
              decision="skipped: PR state unreadable"
              echo "::warning::PR #$pr: state unreadable; its preview is left alone."
            elif [ "$state" = OPEN ]; then
              decision="kept: PR open"
            elif [ "$created" = - ] && ! again=$(bash scripts/ci/preview.sh prs); then
              decision="kept: recheck failed"
              echo "::warning::PR #$pr: could not re-list the previews; its database is left alone."
            elif [ "$created" = - ] && awk -v p="$pr" '$1==p{f=1} END{exit !f}' <<<"$again"; then
              decision="kept: preview came back"
            elif bash scripts/ci/preview.sh teardown "$pr"; then
              decision="deleted: PR $state"
            else
              decision="DELETE FAILED: PR $state"
              failures=$((failures + 1))
            fi
            echo "PR #$pr ($created): $decision"
            echo "| #$pr | $created | $decision |" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$prs"
          [ "$failures" = 0 ] || { echo "::error::$failures preview(s) could not be deleted."; exit 1; }
