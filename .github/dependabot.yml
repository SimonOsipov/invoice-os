version: 2
# ceiling: 2 open PRs per entry holds the first wave near 10; raise it once the backlog clears.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sidecar/docling
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # docling and its pinned deps move deliberately with regenerated goldens (.claude/rules/docling-sidecar.md).
      - dependency-name: docling
      - dependency-name: docling-core
      - dependency-name: docling-parse
      - dependency-name: rapidocr
      - dependency-name: onnxruntime
      - dependency-name: pypdfium2
      - dependency-name: torch

  - package-ecosystem: docker
    directories:
      - /
      - /frontend/app
      - /frontend/blog
      - /frontend/landing
      - /frontend/library
      - /frontend/ops-console
      - /frontend/support-console
      - /sidecar/auth
      - /sidecar/docling
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # An image may be named with or without its registry, so match both.
      # golang moves with go.mod (TestGoPins_RepoAgree); supabase/auth with idppin.
      - dependency-name: "*golang"
      - dependency-name: "*supabase/auth"
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
