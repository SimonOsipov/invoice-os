name: IdP release watch

# Nothing alerts on a red scheduled run here, so any compare failure also opens an issue.
# schedule and workflow_dispatch run only from main; pull_request is the pre-merge run.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/idp-release-watch.yml'
      - 'sidecar/auth/Dockerfile'
      - 'internal/tools/idppin/**'

concurrency:
  group: idp-release-watch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  ISSUE_TITLE: supabase/auth patch due

jobs:
  watch:
    name: supabase/auth pin is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Built, not `go run`: go run turns idppin's exit 2 (bad call) into 1 (mismatch).
      - name: Build idppin
        run: go build -o "$RUNNER_TEMP/idppin" ./internal/tools/idppin

      - name: Compare the pin with the latest release and published advisories
        id: compare
        run: |
          set -euo pipefail
          pin=$("$RUNNER_TEMP/idppin" tag sidecar/auth/Dockerfile)
          pinned_at=$(gh api "repos/supabase/auth/releases/tags/$pin" --jq .published_at)
          latest=$(gh api repos/supabase/auth/releases/latest --jq .tag_name)
          if [ -z "$pinned_at" ] || [ -z "$latest" ]; then
            echo "::error::Could not read the pinned release date or the latest tag (pin $pin)."
            exit 2
          fi
          echo "pinned $pin (published $pinned_at), latest release $latest"

          rc=0
          "$RUNNER_TEMP/idppin" latest-check sidecar/auth/Dockerfile "$latest" || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

          # Independent of the tag comparison: an advisory can land without a release.
          advisories=$(gh api --paginate "repos/supabase/auth/security-advisories?state=published&per_page=100" \
            | jq -r --arg t "$pinned_at" '.[] | select(.published_at > $t) | .ghsa_id' | sort -u | paste -sd, -)

          if [ "$rc" = 0 ] && [ -z "$advisories" ]; then
            echo "No finding: $pin is the latest release and no advisory is newer than it."
            exit 0
          fi
          body="$RUNNER_TEMP/finding.md"
          {
            echo "Kind: finding."
            echo "Pinned: \`$pin\` (published $pinned_at), in \`sidecar/auth/Dockerfile\`."
            echo "Latest release: \`$latest\`."
            echo "Advisories published after the pin: ${advisories:-none}."
            echo
            echo "Upgrade procedure: \`docs/identity-provider.md\`. Last checked by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          } > "$body"
          echo "finding=true" >> "$GITHUB_OUTPUT"
          echo "::error::supabase/auth patch due: pinned $pin, latest $latest, advisories after the pin: ${advisories:-none}."
          exit 1

      # Found by exact title across open and closed issues, so a rerun never opens a duplicate.
      - name: Open or update the patch-due issue
        if: failure() && steps.compare.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          FINDING: ${{ steps.compare.outputs.finding }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/finding.md"
          if [ "$FINDING" != true ]; then
            {
              echo "Kind: error."
              echo "The compare step failed without a finding: a GitHub API error, a missing release or an unreadable pin."
              echo "The pin is unchecked until a run passes. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            } > "$body"
          fi
          found=$(gh issue list --state all --limit 100 --search "in:title \"$ISSUE_TITLE\"" --json number,title,state \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | sort_by(.number) | last // empty | "\(.number) \(.state)"')
          if [ -z "$found" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
            exit 0
          fi
          number=${found% *}
          if [ "${found#* }" = "CLOSED" ]; then
            gh issue reopen "$number"
          fi
          gh issue edit "$number" --body-file "$body"
          echo "Updated issue #$number."
