# SECAUD-19 throwaway probe: proves an unnamed workflow gets no cloud credential. Never merge.
name: secaud-19-oidc-probe
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  refused:
    name: STS exchange is refused
    runs-on: ubuntu-latest
    steps:
      - name: Exchange the OIDC token; pass only on an attribute-condition refusal
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          tok=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg a "https://iam.googleapis.com/$WIF_PROVIDER" '$a|@uri')" | jq -r .value)
          echo "::add-mask::$tok"
          part=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+')
          while [ $(( ${#part} % 4 )) -ne 0 ]; do part="$part="; done
          base64 -d <<<"$part" | jq -S '{repository, repository_id, ref, event_name, workflow_ref, job_workflow_ref}'
          status=$(curl -s -o "$RUNNER_TEMP/sts.json" -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            --data-urlencode "audience=//iam.googleapis.com/$WIF_PROVIDER" \
            --data-urlencode scope=https://www.googleapis.com/auth/cloud-platform \
            --data-urlencode requested_token_type=urn:ietf:params:oauth:token-type:access_token \
            --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            --data-urlencode "subject_token=$tok")
          echo "STS HTTP status: $status"
          if [ "${status:0:1}" = 2 ]; then rm -f "$RUNNER_TEMP/sts.json"; echo "credential issued"; exit 1; fi
          jq -c . "$RUNNER_TEMP/sts.json"
          jq -e '.error_description | contains("rejected by the attribute condition")' "$RUNNER_TEMP/sts.json"

  auth-fails:
    name: auth as deploy-preview fails
    runs-on: ubuntu-latest
    steps:
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deploy-preview@ascomply-preview.iam.gserviceaccount.com
      - name: Pass only when the auth step failed
        env:
          OUTCOME: ${{ steps.auth.outcome }}
        run: '[ "$OUTCOME" = failure ] || { echo "::error::auth outcome $OUTCOME"; exit 1; }'
