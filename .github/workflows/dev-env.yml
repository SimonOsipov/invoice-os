name: Preview (deploy the PR's fleet to Google Cloud + E2E)

# GKE-11: each ready PR, except a Dependabot PR whose every commit is Dependabot's, gets its own fleet in ascomply-preview, <svc>-pr-<N> on run.app, and a fresh
# database pr_<N> on every deploy. scripts/ci/preview.sh does the gcloud work; invoice-os-infra
# preview.tf holds what the PRs share. Closing the PR deletes it (dev-env-teardown.yml); the
# nightly sweep (dev-env-sweeper.yml) deletes what a missed close left. Production deploys from
# deploy-prod.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Shared with dev-env-teardown.yml: a teardown waits for an in-flight deploy of the same PR.
concurrency:
  group: dev-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

env:
  PR: ${{ github.event.pull_request.number }}
  WIF_PROVIDER: projects/428987361227/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER: deploy-preview@ascomply-preview.iam.gserviceaccount.com

jobs:
  # Decides whether this PR needs the deploy chain; `E2E gate` passes a PR it marks not relevant or a Dependabot PR whose every commit is Dependabot's.
  # A skipped or renamed filter yields '', which the gate fails (e2e/mergeGate.ts).
  changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      e2e: ${{ steps.lane.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'packages/**'
              - 'e2e/**'
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'db/**'
              - 'tools/prenv/**'
              - 'scripts/ci/**'
              # TestWorkflows_SidecarPathsAreFiltered
              - 'sidecar/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.dockerignore'
              - 'Caddyfile'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/dev-env.yml'
      - id: lane
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
        run: bash scripts/ci/lane.sh pr-e2e

  # Decides whether Dependabot alone wrote the PR; the preview jobs wait for it. A failure skips them; the gate fails on any result but success.
  commit-authors:
    name: Detect a Dependabot-only PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependabot_only: ${{ steps.verdict.outputs.dependabot_only }}
    steps:
      - uses: actions/checkout@v4
      - id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/dependabot-only.sh "$PR"

  # A PR deploys alongside CI; a red CI makes this job cancel the run, and e2e needs it.
  ci-watch:
    name: Watch CI (PR; red CI stops the run)
    needs: [changes, commit-authors]
    if: github.event.pull_request.draft == false && needs.changes.outputs.e2e == 'true' && needs.commit-authors.outputs.dependabot_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: write
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
      - id: wait
        name: Wait for the CI check to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/await-ci.sh "$SHA"
      - name: Stop this run on a red CI
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPO"

  # GKE-11 AC6: runs on every PR except a Dependabot-only one, ready or draft, relevant or not.
  invariants:
    name: Preview invariants
    needs: [commit-authors]
    if: needs.commit-authors.outputs.dependabot_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - run: bash scripts/ci/preview.sh invariants

  # The PR's secrets and bucket exist before anything deploys; the URLs follow from the PR number.
  prepare-env:
    name: Prepare the preview (secrets, bucket, URLs)
    needs: [changes, commit-authors]
    if: github.event.pull_request.draft == false && needs.changes.outputs.e2e == 'true' && needs.commit-authors.outputs.dependabot_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      gateway_url: ${{ steps.urls.outputs.gateway_url }}
      app_url: ${{ steps.urls.outputs.app_url }}
      landing_url: ${{ steps.urls.outputs.landing_url }}
      ops_console_url: ${{ steps.urls.outputs.ops_console_url }}
      support_console_url: ${{ steps.urls.outputs.support_console_url }}
      library_url: ${{ steps.urls.outputs.library_url }}
      blog_url: ${{ steps.urls.outputs.blog_url }}
    steps:
      - uses: actions/checkout@v4
      # `prenv jwk-es256` generates the PR's GoTrue key.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Create the PR's secrets (generated, never copied from production)
        run: bash scripts/ci/preview.sh secrets "$PR"
      - name: Create the PR's documents bucket
        run: bash scripts/ci/preview.sh bucket "$PR"
      - id: urls
        run: bash scripts/ci/preview.sh urls "$PR" | tee -a "$GITHUB_OUTPUT"

  # One image per service for this PR and commit. The SPAs bake the PR's URLs in at build time;
  # the gateway is built with the mock issuer.
  build:
    name: Build ${{ matrix.image }}
    needs: [changes, commit-authors]
    if: github.event.pull_request.draft == false && needs.changes.outputs.e2e == 'true' && needs.commit-authors.outputs.dependabot_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: gateway, dockerfile: Dockerfile, service: gateway }
          - { image: tenancy, dockerfile: Dockerfile, service: tenancy }
          - { image: portfolio, dockerfile: Dockerfile, service: portfolio }
          - { image: invoice, dockerfile: Dockerfile, service: invoice }
          - { image: validation, dockerfile: Dockerfile, service: validation }
          - { image: dashboard, dockerfile: Dockerfile, service: dashboard }
          - { image: submission, dockerfile: Dockerfile, service: submission }
          - { image: notifications, dockerfile: Dockerfile, service: notifications }
          - { image: worker, dockerfile: Dockerfile, service: worker }
          - { image: migrate, dockerfile: Dockerfile, service: migrate }
          - { image: auth, dockerfile: sidecar/auth/Dockerfile }
          - { image: docling, dockerfile: sidecar/docling/Dockerfile }
          - { image: app, dockerfile: frontend/app/Dockerfile, spa: true }
          - { image: landing, dockerfile: frontend/landing/Dockerfile, spa: true }
          - { image: library, dockerfile: frontend/library/Dockerfile, spa: true }
          - { image: blog, dockerfile: frontend/blog/Dockerfile, spa: true }
          - { image: ops-console, dockerfile: frontend/ops-console/Dockerfile, spa: true }
          - { image: support-console, dockerfile: frontend/support-console/Dockerfile, spa: true }
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet
      - id: exists
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image=$(bash scripts/ci/preview.sh image "$PR" "$IMAGE_NAME" "$SHA")
          echo "image=$image" >>"$GITHUB_OUTPUT"
          if gcloud artifacts docker images describe "$image" --quiet >/dev/null 2>&1; then
            echo "built=true" >>"$GITHUB_OUTPUT"
            echo "$image exists; not rebuilt."
          fi
      - name: Stamp the build sha into the image
        if: steps.exists.outputs.built != 'true'
        run: sh scripts/ci/stamp-build-sha.sh "$SHA"
      - name: Stamp the mock issuer into the gateway
        if: steps.exists.outputs.built != 'true' && matrix.image == 'gateway'
        run: sh scripts/ci/stamp-mock-issuer.sh
      # The PR's URLs and no Sentry; production's analytics ids, which the consent specs read.
      - name: Build and push
        if: steps.exists.outputs.built != 'true'
        env:
          IMAGE: ${{ steps.exists.outputs.image }}
          SERVICE: ${{ matrix.service }}
          SPA: ${{ matrix.spa }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          args=(--build-arg "BUILD_SHA=$SHA")
          if [ -n "$SERVICE" ]; then args+=(--build-arg "SERVICE=$SERVICE"); fi
          if [ "$SPA" = "true" ]; then
            eval "$(bash scripts/ci/preview.sh urls "$PR")"
            # shellcheck disable=SC2154 # set by the eval above
            args+=(
              --build-arg "VITE_GATEWAY_URL=$gateway_url"
              --build-arg "VITE_APP_URL=$app_url"
              --build-arg "VITE_LANDING_URL=$landing_url"
              --build-arg "VITE_LIBRARY_URL=$library_url"
              --build-arg "VITE_BLOG_URL=$blog_url"
              --build-arg "VITE_OPS_URL=$ops_console_url"
              --build-arg "VITE_SUPPORT_URL=$support_console_url"
              --build-arg VITE_GA_MEASUREMENT_ID=G-E409H76XYY
              --build-arg VITE_HUBSPOT_PORTAL_ID=148915098
              --build-arg VITE_HUBSPOT_FORM_GUID=8e9cf78f-e6a6-4128-9b3d-8c09d5710daf
              --build-arg VITE_REGISTRATION_OPEN=true
            )
          fi
          docker build -f "$DOCKERFILE" "${args[@]}" -t "$IMAGE" .
          docker push "$IMAGE"

  # Fresh pr_<N> → migrate job (bootstrap, migrate, seed) → GoTrue → the grant on auth.users →
  # the backends → the sites. Cloud SQL refuses an in-place reset (GKE-01 P4).
  deploy:
    name: Deploy the PR's fleet
    needs: [prepare-env, build]
    if: "!cancelled() && needs.prepare-env.result == 'success' && needs.build.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    # e2e compares this with its own attempt: the database is recreated only when this job runs.
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Recreate the database pr_${{ env.PR }}
        run: bash scripts/ci/preview.sh database "$PR"
      - name: Run the migrate job (bootstrap, migrate, seed)
        run: bash scripts/ci/preview.sh migrate "$PR" "$SHA"
      - name: Deploy GoTrue
        run: bash scripts/ci/preview.sh deploy "$PR" "$SHA" auth
      - name: Grant the account-state read on auth.users
        run: bash scripts/ci/preview.sh grant "$PR"
      - name: Deploy the backends
        run: bash scripts/ci/preview.sh deploy "$PR" "$SHA" gateway tenancy portfolio invoice validation dashboard submission notifications docling worker
      - name: Deploy the sites
        run: bash scripts/ci/preview.sh deploy "$PR" "$SHA" app landing library blog ops-console support-console

  # The PR gateway serves the mock issuer and trusts it and its own GoTrue.
  health-gate:
    name: Gate on gateway /health (commit, mock issuer, issuers)
    needs: [deploy, prepare-env]
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
    steps:
      - name: Wait for gateway /health 200 on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          echo "Waiting for $GATEWAY_URL/health to report build $EXPECTED_BUILD ..."
          ok=0
          seen=""
          mock=""
          issuers=""
          for _ in $(seq 1 60); do
            body=$(curl -fsS --connect-timeout 5 --max-time 10 "$GATEWAY_URL/health" 2>/dev/null || echo '')
            seen=$(printf '%s' "$body" | jq -r '.build // empty' 2>/dev/null || echo '')
            if [ -n "$seen" ] && [ "$seen" = "$EXPECTED_BUILD" ]; then
              # Read the fields out of the SAME body that carried the matching build.
              mock=$(printf '%s' "$body" | jq -r '.mock_issuer // empty' 2>/dev/null || echo '')
              issuers=$(printf '%s' "$body" | jq -r '.auth_issuers // empty' 2>/dev/null || echo '')
              echo "  gateway healthy on $seen (mock_issuer=${mock:-none}, auth_issuers=${issuers:-none})"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::$GATEWAY_URL/health did not report build $EXPECTED_BUILD within 300s (last seen: '${seen:-none}'). The deploy job's log has each service's gcloud output."
            exit 1
          fi

          if [ "$mock" != on ]; then
            echo "::error::gateway is serving $EXPECTED_BUILD but reports mock_issuer='${mock:-none}', want 'on'. 'absent' means scripts/ci/stamp-mock-issuer.sh did not tag the build; 'off' means ENVIRONMENT or GATEWAY_MOCK_ISSUER gated it off."
            exit 1
          fi
          # A preview trusts its mock and its own GoTrue.
          if [ "$issuers" != 2 ]; then
            echo "::error::gateway is serving $EXPECTED_BUILD but reports auth_issuers='${issuers:-none}', want '2'. '1' means preview.sh did not set AUTH_ADDITIONAL_ISSUERS on the gateway."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # GoTrue fetches these templates from the gateway; production's URLs name the same paths.
      - name: Gate on the account-mail templates
        run: go run ./tools/prenv mail-template-check "$GATEWAY_URL/emails/confirmation.html" "$GATEWAY_URL/emails/recovery.html"

  # Every backend on the commit, Sentry off, contacts fake. auth reports no build.
  fleet-gate:
    name: Fleet /healthz gate (all backends green)
    needs: [deploy, prepare-env]
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      # /healthz/fleet needs X-Gateway-Token (GKE-08).
      - name: Read the PR's gateway token
        run: |
          token=$(bash scripts/ci/preview.sh token "$PR")
          echo "::add-mask::$token"
          echo "GATEWAY_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Poll gateway /healthz/fleet until all up on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          echo "Polling $GATEWAY_URL/healthz/fleet for build $EXPECTED_BUILD ..."
          code=000
          stale="(never polled)"
          for _ in $(seq 1 120); do
            code=$(curl -sS --connect-timeout 5 --max-time 40 -H "X-Gateway-Token: $GATEWAY_TOKEN" -o /tmp/fleet.json -w '%{http_code}' "$GATEWAY_URL/healthz/fleet" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              stale=$(jq -r --arg b "$EXPECTED_BUILD" '[.services[] | select(.name != "auth" and .build != $b) | "\(.name)=\(.build // "none")"] | join(", ")' /tmp/fleet.json 2>/dev/null || echo 'unparseable')
              if [ -z "$stale" ]; then break; fi
            fi
            sleep 5
          done
          echo "--- fleet health (HTTP $code) ---"
          jq . /tmp/fleet.json 2>/dev/null || cat /tmp/fleet.json || true
          if [ "$code" != "200" ]; then
            echo "::error::fleet not all-green (HTTP $code). Down services:"
            jq -r '.services[] | select(.status != "up") | "  DOWN: \(.name) — \(.error // "unhealthy")"' /tmp/fleet.json 2>/dev/null || true
            exit 1
          fi
          if [ -n "$stale" ]; then
            echo "::error::fleet is healthy but not on $EXPECTED_BUILD after 600s — still serving: $stale. A 'none' build means that service's stamp step did not run."
            exit 1
          fi
          echo "All backends green on $EXPECTED_BUILD (auth reports no build)."

      - name: Gate on the fleet's Sentry state
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          parsed=0
          for _ in $(seq 1 5); do
            if curl -sS --connect-timeout 5 --max-time 40 -H "X-Gateway-Token: $GATEWAY_TOKEN" -o /tmp/sentry-fleet.json "$GATEWAY_URL/healthz/fleet" \
              && jq -e '.services | type == "array"' /tmp/sentry-fleet.json >/dev/null 2>&1; then
              parsed=1
              break
            fi
            sleep 5
          done
          if [ "$parsed" != 1 ]; then
            echo "::error::$GATEWAY_URL/healthz/fleet was unreachable or had no services list after 5 tries; the fleet's Sentry state is unknown."
            exit 1
          fi
          want='["off"]'
          direction=off
          checked='[.services[] | select(.name != "auth")]'
          names=$(jq -r "$checked | map(.name) | join(\", \")" /tmp/sentry-fleet.json) || {
            echo "::error::the fleet roll-up has a services entry that is not an object; the Sentry state is unverified."
            exit 1
          }
          if ! jq -e "$checked | any(.name == \"gateway\")" /tmp/sentry-fleet.json >/dev/null 2>&1; then
            echo "::error::the fleet roll-up has no gateway entry (checked: ${names:-nothing}); the Sentry state is unverified."
            exit 1
          fi
          offenders=$(jq -r --arg b "$EXPECTED_BUILD" --argjson want "$want" "$checked"' | map(select(.build != $b or (.sentry | IN($want[]) | not)) | "\(.name)=\(.sentry // "none")@\(.build // "none")") | join(", ")' /tmp/sentry-fleet.json) || {
            echo "::error::the fleet roll-up has a services entry that is not an object; the Sentry state is unverified."
            exit 1
          }
          if [ -n "$offenders" ]; then
            echo "::error::want Sentry $direction on $EXPECTED_BUILD; offenders: $offenders"
            echo "::error::'none' means the service predates the sentry field, or is down (none@none). On a PR, 'on' means a DSN reached the preview: check preview.sh. Any other build means its new revision never replaced the old one."
            exit 1
          fi
          echo "Sentry $direction on $EXPECTED_BUILD for: $names (auth exempt)."

      # A preview must deliver nothing to HubSpot or Resend.
      - name: Gate on notifications' contacts delivery mode
        run: |
          set -euo pipefail
          mode=""
          for _ in $(seq 1 5); do
            if curl -sS --connect-timeout 5 --max-time 40 -H "X-Gateway-Token: $GATEWAY_TOKEN" -o /tmp/contacts-fleet.json "$GATEWAY_URL/healthz/fleet" \
              && jq -e '.services | type == "array"' /tmp/contacts-fleet.json >/dev/null 2>&1; then
              mode=$(jq -r '[.services[] | select(.name == "notifications") | .contacts // "none"][0] // "absent"' /tmp/contacts-fleet.json)
              if [ "$mode" = fake ]; then break; fi
            fi
            sleep 5
          done
          if [ "$mode" != fake ]; then
            echo "::error::notifications reports contacts='${mode:-unreachable}', want 'fake'. Anything else means the preview could write to HubSpot or Resend: check DEPLOY_ENV is pr-<N>."
            exit 1
          fi
          echo "notifications reports contacts=fake."

  # Smoke (landing, library, blog and both consoles render) and api (typed contract suite) here;
  # topology after it. The api suite writes data, so it runs only against a preview.
  e2e:
    name: E2E (smoke + api)
    needs: [fleet-gate, health-gate, prepare-env, deploy, ci-watch]
    if: >-
      !cancelled() &&
      needs.fleet-gate.result == 'success' &&
      needs.health-gate.result == 'success' &&
      needs.ci-watch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # flaky-spec gate lists the PR's changed files
      id-token: write
    env:
      FLAKY_JSON_DIR: ${{ github.workspace }}/e2e/flaky-results
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
      APP_URL: ${{ needs.prepare-env.outputs.app_url }}
      LANDING_URL: ${{ needs.prepare-env.outputs.landing_url }}
      OPS_CONSOLE_URL: ${{ needs.prepare-env.outputs.ops_console_url }}
      SUPPORT_CONSOLE_URL: ${{ needs.prepare-env.outputs.support_console_url }}
      LIBRARY_URL: ${{ needs.prepare-env.outputs.library_url }}
      BLOG_URL: ${{ needs.prepare-env.outputs.blog_url }}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # "Re-run failed jobs" keeps the deploy job's output from an earlier attempt.
      - name: Refuse a re-run that skipped the deploy
        id: attempt
        env:
          DEPLOYED_ATTEMPT: ${{ needs.deploy.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$DEPLOYED_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error::Re-run the whole workflow, not failed jobs — the database is recreated only when the deploy job runs. It last ran in attempt '${DEPLOYED_ATTEMPT:-none}'; this is attempt $RUN_ATTEMPT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: List the topology shards
        id: shards
        run: |
          shards="$(node e2e/topology/shards.ts)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts
      # After the install: the fleet specs send the PR's gateway token.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Read the PR's gateway token
        run: |
          token=$(bash scripts/ci/preview.sh token "$PR")
          echo "::add-mask::$token"
          echo "GATEWAY_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Wait for SPA /health on the commit under test
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: bash scripts/ci/wait-spa-builds.sh "$EXPECTED_BUILD" "$LANDING_URL" "$APP_URL" "$OPS_CONSOLE_URL" "$SUPPORT_CONSOLE_URL" "$LIBRARY_URL" "$BLOG_URL"
      - name: Install Chromium
        # !cancelled(): skipping this when the wait fails makes smoke report
        # `browserType.launch: Executable doesn't exist` for what is really an unreachable SPA.
        if: "!cancelled() && steps.attempt.outcome == 'success'"
        run: pnpm --filter @invoice-os/e2e exec playwright install --with-deps chromium
      - name: Smoke (landing, library, blog and both consoles render)
        run: pnpm --filter @invoice-os/e2e test:smoke
      # Both suites write to the SAME e2e/playwright-report/. Park each report the
      # moment its suite ends, before the next one overwrites it.
      - name: Park the smoke report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-smoke
          fi
      - name: API E2E (typed contract suite)
        # !cancelled(): a red smoke step must not withhold the api verdict.
        if: "!cancelled() && steps.attempt.outcome == 'success'"
        # Finishes before the topology job starts (`needs: e2e`): it shares the database with topology.
        run: pnpm --filter @invoice-os/e2e test:api
      - name: Park the API report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-api
          fi
      # A retry-pass elsewhere stays a summary warning; in a spec this PR changed it fails.
      - name: Fail on a retry-pass in a spec this PR changed
        if: always() && steps.attempt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -euo pipefail
          gh api --paginate "$PR_FILES_API" --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          node e2e/flakyGate.ts "$FLAKY_JSON_DIR" "$RUNNER_TEMP/pr-files.txt"
      # always(): a spec that fails then passes on retry leaves the job green, and its trace is
      # the only evidence.
      - name: Upload smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: e2e/report-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload API Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: e2e/report-api/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the flaky JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-results-e2e-${{ github.run_attempt }}
          path: e2e/flaky-results/
          if-no-files-found: ignore
          retention-days: 30

  # Each topology unit runs on its own runner after smoke + api; the map is in e2e/topology/shards.ts.
  topology:
    name: E2E topology (${{ matrix.shard }})
    needs: [e2e, prepare-env, deploy]
    if: "!cancelled() && needs.e2e.result == 'success'"
    runs-on: ubuntu-latest
    # ceiling: serial-lane is the longest shard, ~23 min on run.app (auth ~17); split it again (e2e/topology/shards.ts) above 25.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: read   # flaky-spec gate lists the PR's changed files
      id-token: write
    env:
      FLAKY_JSON_DIR: ${{ github.workspace }}/e2e/flaky-results
      GATEWAY_URL: ${{ needs.prepare-env.outputs.gateway_url }}
      APP_URL: ${{ needs.prepare-env.outputs.app_url }}
      LANDING_URL: ${{ needs.prepare-env.outputs.landing_url }}
      OPS_CONSOLE_URL: ${{ needs.prepare-env.outputs.ops_console_url }}
      SUPPORT_CONSOLE_URL: ${{ needs.prepare-env.outputs.support_console_url }}
      LIBRARY_URL: ${{ needs.prepare-env.outputs.library_url }}
      BLOG_URL: ${{ needs.prepare-env.outputs.blog_url }}
      # The URLs the SPAs were built with; on run.app they are the serving URLs.
      BAKED_APP_URL: ${{ needs.prepare-env.outputs.app_url }}
      BAKED_LANDING_URL: ${{ needs.prepare-env.outputs.landing_url }}
      BAKED_LIBRARY_URL: ${{ needs.prepare-env.outputs.library_url }}
      BAKED_BLOG_URL: ${{ needs.prepare-env.outputs.blog_url }}
    steps:
      - name: Refuse a re-run that skipped the deploy
        id: attempt
        env:
          DEPLOYED_ATTEMPT: ${{ needs.deploy.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$DEPLOYED_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error::Re-run the whole workflow, not failed jobs — the database is recreated only when the deploy job runs. It last ran in attempt '${DEPLOYED_ATTEMPT:-none}'; this is attempt $RUN_ATTEMPT."
            exit 1
          fi
      - name: Refuse empty target URLs
        id: targets
        run: |
          rc=0
          for v in GATEWAY_URL APP_URL LANDING_URL OPS_CONSOLE_URL SUPPORT_CONSOLE_URL LIBRARY_URL BLOG_URL BAKED_APP_URL BAKED_LANDING_URL BAKED_LIBRARY_URL BAKED_BLOG_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — prepare-env did not publish it."
              rc=1
            fi
          done
          exit "$rc"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @invoice-os/e2e exec playwright install --with-deps chromium
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Read the PR's gateway token
        run: |
          token=$(bash scripts/ci/preview.sh token "$PR")
          echo "::add-mask::$token"
          echo "GATEWAY_TOKEN=$token" >>"$GITHUB_ENV"
      - name: Topology (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @invoice-os/e2e test:topology --project="$SHARD"
      - name: Park the topology report
        if: always()
        run: |
          if [ -d e2e/playwright-report ]; then
            mv e2e/playwright-report e2e/report-topology
          fi
      # A retry-pass elsewhere stays a summary warning; in a spec this PR changed it fails.
      - name: Fail on a retry-pass in a spec this PR changed
        if: always() && steps.attempt.outcome == 'success' && steps.targets.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -euo pipefail
          gh api --paginate "$PR_FILES_API" --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          node e2e/flakyGate.ts "$FLAKY_JSON_DIR" "$RUNNER_TEMP/pr-files.txt"
      - name: Upload topology Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-playwright-report-${{ matrix.shard }}
          path: e2e/report-topology/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the flaky JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-results-topology-${{ matrix.shard }}-${{ github.run_attempt }}
          path: e2e/flaky-results/
          if-no-files-found: ignore
          retention-days: 30

  # The required merge check: always reports on a PR, so a skipped E2E cannot read as a pass.
  e2e-gate:
    name: E2E gate
    needs: [changes, commit-authors, e2e, topology, ci-watch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node e2e/mergeGate.ts
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RELEVANT: ${{ needs.changes.outputs.e2e }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TOPOLOGY_RESULT: ${{ needs.topology.result }}
          CI_RESULT: ${{ needs.ci-watch.result }}
          CI_CONCLUSION: ${{ needs.ci-watch.outputs.conclusion }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMITS_ONLY_DEPENDABOT: ${{ needs.commit-authors.outputs.dependabot_only }}
          COMMIT_AUTHORS_RESULT: ${{ needs.commit-authors.result }}
