name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which parts of the monorepo changed so SPA-only PRs skip Go and
  # Go-only PRs skip the frontend. A change to this workflow triggers both.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'tools/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.dockerignore'
              - '.github/workflows/ci.yml'
            migrations:
              - 'migrations/**'
              - 'db/**'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            # Gates the "Frontend" job, which is the pnpm workspace job — not just the
            # SPAs. It runs `pnpm -r typecheck` (all 5 packages, e2e included) and the
            # e2e seam unit tests, so `e2e/**` belongs here even though the name says
            # frontend.
            #
            # It was missing, and `e2e/**` appears in no other filter, so a commit
            # touching ONLY e2e/ matched nothing: go skipped, migrations skipped,
            # frontend skipped, CI green having typechecked and unit-tested nothing.
            # Its Playwright specs would still have run in dev-env.yml (which does list
            # e2e/**), but only after a full fleet deploy — so a spec that failed to
            # COMPILE cost ~20 minutes to discover instead of ~2.
            frontend:
              - 'frontend/**'
              - 'packages/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  go:
    name: Go
    needs: changes
    # db/** (e.g. db/embed.go) is a real .go file path but lives only in the
    # migrations filter, not go — cover both so a db/-only PR still hits this job.
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    # No Postgres here on purpose: every DB-backed suite (RLS, queue) is env-gated and
    # SKIPS without its per-role DATABASE_* URLs, so each runs in its own bootstrap+migrate
    # job below (`rls`, `queue`) — never here. A DATABASE_URL in this job would point the
    # queue smoke suite at an unmigrated DB, so it is deliberately absent. This job
    # builds/vets/tests the pure-Go units.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No dependencies / go.sum yet — nothing to cache. Enable in M2.
          cache: false
      - name: Format (gofmt agreement + no smart-quoted SQL literals)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: not formatted:"; echo "$unformatted"; gofmt -d $unformatted; exit 1
          fi
          # U+201C/U+201D in Go source is always gofmt eating a '' SQL empty string (bf1856b).
          # LC_ALL=C.UTF-8 pins UTF-8 decoding so the bracket expression can't byte-split
          # under a byte-oriented locale and false-positive on an em-dash.
          if LC_ALL=C.UTF-8 grep -rn $'[“”]' --include='*.go' . ; then
            echo "::error::smart quote in Go source — a '' SQL literal was reformatted away"; exit 1
          fi
      - name: Build
        run: go build ./...
      # vet/test error on an empty module ("no packages"), so gate them on
      # there being at least one package. They run automatically from M2 on.
      - name: Vet
        run: |
          if [ -n "$(go list ./...)" ]; then
            go vet ./...
          else
            echo "No Go packages yet — skipping vet (wired for M2)."
          fi
      - name: Test
        run: |
          if [ -n "$(go list ./...)" ]; then
            go test ./...
          else
            echo "No Go packages yet — skipping test (wired for M2)."
          fi

  # Prove the shared multi-service Dockerfile (M2-04) actually builds before it
  # reaches Railway (M2-12). All seven services stamp the same root Dockerfile
  # with only the SERVICE build arg differing, so one plain service (tenancy) is
  # enough to guard "Option B": the build only sees Go source because
  # Dockerfile.dockerignore overrides the SPA-tuned root .dockerignore, so a
  # regression in either fails here (BuildKit via buildx) instead of at deploy
  # time. gateway is built separately (task-128, M4-21-04): it is the ONE service
  # that imports package db (dbsql.FS, for db.Provision's bootstrap/seed steps),
  # so it is the only build that actually exercises Dockerfile.dockerignore's
  # `!db/bootstrap.sql` / `!db/seed.dev.sql` / `!db/embed.go` carve-out — tenancy
  # alone would never catch a regression there (confirmed empirically: removing
  # the carve-out still builds tenancy fine but fails gateway's compile). No
  # image is pushed.
  docker-canary:
    name: Docker image (canary)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build one plain service image (SERVICE=tenancy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=tenancy
          push: false
      - name: Build the gateway image (SERVICE=gateway) — exercises the db/ dockerignore carve-out
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=gateway
          push: false

  # The independent migration gate (M2-01, task-9.2): prove the goose harness end to
  # end against a FRESH, ephemeral Postgres — zero Railway dependency. Bootstrap the
  # two non-superuser roles as the superuser, apply every migration as the migrator,
  # assert nothing is left pending, then a reset→up round-trip to prove every
  # migration is reversible. The DB is empty each run (no reliance on prior state).
  # Modeled on learn-greek-easy's gating alembic-check; see docs/migrations.md §6.
  migrations:
    name: Migrations (fresh Postgres)
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    # Postgres MAJOR must match the Railway-provisioned major (both 18 today —
    # Railway's postgres-ssl template provisioned PG18) — bump together. See
    # docs/migrations.md §6 and add-a-service.md.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # bootstrap runs as the superuser; goose runs as the migrator. DATABASE_URL
      # (the app role) is added ONLY so TestSuperuserDSNNotRetainedForRequestPath
      # (task-128 / AC-4) can prove the request-serving pool it opens comes from
      # DATABASE_URL, not the superuser DSN — no other step in this job uses it.
      # Dev-safe passwords only — this is an ephemeral throwaway DB.
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/invoice_os?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://invoice_migrator:migrator@localhost:5432/invoice_os?sslmode=disable
      DATABASE_URL: postgres://invoice_app:app@localhost:5432/invoice_os?sslmode=disable
      MIGRATOR_PASSWORD: migrator
      APP_PASSWORD: app
      READER_PASSWORD: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Bootstrap non-superuser roles (as superuser; psql is preinstalled on the runner)
        run: make db-bootstrap
      - name: Apply all migrations from empty (as migrator)
        run: make migrate-up
      - name: Assert nothing pending after up
        # goose prints status to stderr — capture with 2>&1 or the grep never matches.
        run: |
          if make migrate-status 2>&1 | grep -qi 'pending'; then
            echo "::error::migrations still pending after 'up'"
            make migrate-status 2>&1 || true
            exit 1
          fi
          echo "No pending migrations after up."
      - name: Reversibility round-trip (reset all down -> up)
        # `reset` runs every Down; a broken/irreversible down exits non-zero here.
        run: |
          make migrate-reset
          make migrate-up
          if make migrate-status 2>&1 | grep -qi 'pending'; then
            echo "::error::migrations pending after reset->up round-trip"
            exit 1
          fi
          echo "Reset -> up round-trip clean; every migration is reversible."
      - name: Embedded-migration apply (the gateway's on-deploy path) + per-test visibility & skip gate
        # Prove the migrations embedded into the gateway binary (go:embed +
        # internal/platform/db.MigrateUp) apply from empty and leave nothing
        # pending — the exact code path the gateway runs at boot (M2-12,
        # docs/migrations.md §2). The filesystem round-trip above can't catch a
        # stale/incomplete go:embed; this can. DATABASE_MIGRATION_URL is already in
        # this job's env, so the test runs here (it self-skips everywhere else).
        run: scripts/ci/rls-test-gate.sh -count=1 -run TestMigrateUpFromEmbedded ./internal/platform/db/...
      - name: Demo-portfolio repair migration suite (as migrator, no pre-set tenant) + per-test visibility & skip gate
        # Executes the repair migration's own Up/Down body as invoice_migrator with no
        # app.current_tenant pre-set — the body's own set_config calls are what is under
        # test. Placed after the step above because that one ends with DownTo(0) +
        # MigrateUp, which wipes anything seeded before it.
        run: scripts/ci/rls-test-gate.sh -count=1 -run TestDemoRepairMigration ./internal/platform/db/...
      - name: Bootstrap-SQL pgx-caller suite (fail-closed GUCs, idempotency, rotation) + per-test visibility & skip gate
        # M4-21-02: proves db/bootstrap.sql itself — now rewritten to read its three
        # role passwords from session GUCs instead of psql-only \set/:'var', so a pgx
        # caller (not just psql) can execute the identical file (Decision
        # [one-bootstrap-file]). Covers create-or-converge, security-attribute
        # re-assertion, fail-closed on a missing/empty password GUC, idempotency,
        # deterministic password rotation, and schema-grant shape. Needs only
        # DATABASE_SUPERUSER_URL, already in this job's env; self-skips everywhere else.
        run: scripts/ci/rls-test-gate.sh -count=1 -run 'TestBootstrap|TestMakefileDevDB' ./internal/platform/db/...
      - name: Gateway boot-path provisioning suite (bootstrap->migrate->reset->seed) + per-test visibility & skip gate
        # M4-21-04 (task-128, AC-6): proves db.Provision — the entry point
        # cmd/gateway/main.go calls at boot — composes bootstrap (gated) -> migrate
        # (unconditional) -> reset (gated, PR-environments only — persona-handoff-fix,
        # Decision [pr-only-reset]) -> seed (gated) in order, short-circuits on the
        # first error, honors the raw-ENVIRONMENT allowlist guard, and never retains
        # the superuser DSN past boot (QA F1/F3). `TestReset` is included here (not
        # just matched by `TestProvision`) because db.Reset/db.ResetEnabled also have
        # DB-backed and pure-logic tests exercised directly, not only through
        # Provision — see internal/platform/db/reset_test.go. Needs all three of
        # DATABASE_SUPERUSER_URL/DATABASE_MIGRATION_URL/DATABASE_URL, all already in
        # this job's env; the gate turns a silently-skipped test (e.g. a future PR
        # that drops DATABASE_URL again) into a failed step instead of a quiet pass.
        run: scripts/ci/rls-test-gate.sh -count=1 -run 'TestProvision|TestReset|TestSuperuserDSNNotRetainedForRequestPath|TestGatewayMain' ./internal/platform/db/...

  # The M2-07 adversarial RLS suite. Proves the M2-06 tenant-isolation mechanism
  # (FORCE RLS + WithinTenantTx) holds by attacking it as each role against a real
  # Postgres: cross-tenant SELECT/INSERT/UPDATE refused, a missing tenant context
  # fails closed, the table owner cannot bypass a FORCE'd table, and a reused pooled
  # connection cannot carry tenant context across transactions. It bootstraps roles
  # and migrates exactly like the `migrations` job, then runs the suite as the
  # app/migrator/reader roles. The suite SKIPS itself when these DATABASE_* URLs are
  # absent, so the `go` job above and a bare local `go test ./...` stay green without
  # a database. See docs/migrations.md §6, §8. (The build plan floated testcontainers;
  # we reuse this service-container + Makefile-bootstrap path instead — no new Go
  # dependency, one canonical bootstrap, CI-consistent.)
  rls:
    name: RLS isolation (adversarial)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # bootstrap runs as the superuser; goose runs as the migrator; the suite then
      # connects as all four identities. Dev-safe passwords only (ephemeral throwaway
      # DB). NEVER point the app/migrator/reader URLs at the superuser — BYPASSRLS
      # would make every isolation policy a silent no-op.
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/invoice_os?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://invoice_migrator:migrator@localhost:5432/invoice_os?sslmode=disable
      DATABASE_URL: postgres://invoice_app:app@localhost:5432/invoice_os?sslmode=disable
      DATABASE_READER_URL: postgres://invoice_tenant_reader:reader@localhost:5432/invoice_os?sslmode=disable
      MIGRATOR_PASSWORD: migrator
      APP_PASSWORD: app
      READER_PASSWORD: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Bootstrap non-superuser roles (as superuser; psql is preinstalled on the runner)
        run: make db-bootstrap
      - name: Apply all migrations (as migrator)
        run: make migrate-up
      - name: Run the adversarial RLS suite (as app / migrator / reader) + per-test visibility & skip gate
        # -count=1 disables the test cache: the suite MUST re-run against this fresh DB.
        run: scripts/ci/rls-test-gate.sh -count=1 -run TestRLS ./internal/platform/db/...
      - name: Tenancy /v1/me suite (RLS-scoped read as invoice_app) + per-test visibility & skip gate
        # M2-13/M3-02-01: proves Store.Me's bare SELECTs resolve to exactly the
        # caller's tenant + domain role under RLS. Needs DATABASE_URL (app) +
        # DATABASE_SUPERUSER_URL (seed) — both already in this job's env; it
        # self-skips everywhere else.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/tenancy/...
      - name: Portfolio /v1/entities suite (RLS-scoped CRUD + audit as invoice_app) + per-test visibility & skip gate
        # M3-03: proves the portfolio store's CRUD/lifecycle methods resolve to exactly
        # the caller's tenant under RLS and write audit rows in the same tx. Needs
        # DATABASE_URL (app) + DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/portfolio/...
      - name: Invoice /v1 suite (RLS-scoped store CRUD + genesis history + audit as invoice_app) + per-test visibility & skip gate
        # M4-02: proves the invoice store's Create/Get/List/Update resolve to exactly
        # the caller's tenant under RLS and write the genesis invoice_status_history +
        # audit rows in the same tx (INV-STORE-* + cross-tenant child-scope). Needs
        # DATABASE_URL (app) + DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/invoice/...
      - name: Importer /v1/imports suite (decode + import_batches store + service + handler as invoice_app) + per-test visibility & skip gate
        # M4-03: proves the bulk-import path against a real Postgres — import_batches
        # CreateBatch/Finalize, against-stored dedup + entity-supplier lookup under RLS,
        # the map/normalize/group/classify/orchestrate service (quarantine granularity,
        # partial success, dry-run-persists-nothing, store-verbatim) and the multipart
        # handler, plus the 500-invoice/1500-row budget guard. Needs DATABASE_URL (app)
        # + DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/importer/...
      - name: Validation /v1 suite (engine + store + handlers as invoice_app) + per-test visibility & skip gate
        # M3-04: proves the rules-as-data engine, the DB-backed Store (LoadActiveRuleSet
        # + ToggleRule audit) and the HTTP handlers over the migrated rules tables. Needs
        # DATABASE_URL (app) + DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/validation/...
      - name: Dashboard /v1/rollup suite (RLS-scoped rollup + top-violations reads as invoice_app) + per-test visibility & skip gate
        # M4-07: proves the dashboard store's per-entity rollup and per-rule
        # top-violations queries resolve to exactly the caller's tenant under RLS
        # (DASH-14 / DASH-27 cross-tenant refusal). Needs DATABASE_URL (app) +
        # DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/dashboard/...
      - name: Document store suite (RLS-scoped documents upsert/get + audit as invoice_app) + per-test visibility & skip gate
        # DOC-01: proves the source-document store's Upsert/Get resolve to exactly the
        # caller's tenant under RLS (per-tenant dedupe, cross-tenant refusal) and write
        # document.created/reused/read in the same tx, plus the bytes-first service
        # ordering. Needs DATABASE_URL (app) + DATABASE_SUPERUSER_URL (seed) — both
        # already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/document/...
      - name: Demo source-document seeder suite (allowlist + per-entity grouping as invoice_app) + per-test visibility & skip gate
        # DOC-02: proves the boot-time seeder that gives db/seed.dev.sql's invoices a
        # source document — one file per supplier entity, source_rows matching the rows
        # it wrote, no relink of an already-linked invoice, and the tenant allowlist
        # that keeps it off non-demo data wherever it runs. Needs DATABASE_URL (app) +
        # DATABASE_SUPERUSER_URL (seed) — both already in this job's env.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/demodocs/...
      - name: Demo approval-policy seeder suite (convergence + allowlist + staffed seat as invoice_app) + per-test visibility & skip gate
        # Proves the boot-time seeder that arms BOTH demo tenants' validated backlogs:
        # it CONVERGES rather than inserting-if-absent (db.Reset truncates
        # approval_runs but not the policy tables) by publishing, reactivating or
        # superseding, the allowlist keeps it off every non-demo tenant, and each
        # active-version approval step names a seat with an ACTIVE holder. Needs
        # DATABASE_URL (app) + DATABASE_SUPERUSER_URL (seed) — both already in this
        # job's env. -p 1: the suite mutates the shared demo tenants and restores them.
        run: scripts/ci/rls-test-gate.sh -p 1 -count=1 ./internal/demopolicy/...
      - name: Approval workflow-roles + policy seal-lock immutability suite (RLS-scoped roles + staffing + audit, owner-proof triggers as invoice_migrator) + per-test visibility & skip gate
        # Proves the workflow_roles / workflow_role_members store resolves to exactly the
        # caller's tenant under RLS (per-tenant key uniqueness, cross-tenant refusal, whole-set
        # staffing replace) + audit in the same tx, and the five-mechanism seal lock on
        # approval_policy_* binds the table OWNER, not just RLS. Needs DATABASE_URL +
        # DATABASE_SUPERUSER_URL + DATABASE_MIGRATION_URL.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/approval/...
      - name: Demo-seed suite + CI -run filter coverage (as superuser) + per-test visibility & skip gate
        # The 47 TestSeed* functions self-seed (db.Seed is the system under test); must run
        # last in the job since db.Seed re-anchors created_at and re-enables every rule.
        run: scripts/ci/rls-test-gate.sh -count=1 -run 'TestSeed|TestCIRunFilters' ./internal/platform/db/...

  # The M2-08 smoke + M2-09 exactly-once queue suites. Prove the async job spine end to end
  # against a real Postgres AS invoice_app (non-superuser, NOBYPASSRLS): the transactional-
  # outbox enqueue commits a job + its idempotency key atomically (a rollback leaves
  # neither), a duplicate business key yields exactly one job, and — adversarially (M2-09) —
  # the exactly-once composite holds under rollback, concurrent workers (SKIP LOCKED),
  # committed-then-crashed retries (the OncePerJob guard), poison/DLQ discard, and operator
  # re-drive. It bootstraps roles and migrates exactly like the `migrations`/`rls` jobs
  # (creating River's tables + idempotency_keys), then runs the whole ./internal/submission
  # package as invoice_app; the M2-09 suite also needs DATABASE_MIGRATION_URL (already set
  # below) to create its runtime effects table as the migrator. Both suites SKIP themselves
  # without their DATABASE_* URLs, so the `go` job and a bare `go test ./...` stay green.
  queue:
    name: Queue suites (River outbox + exactly-once)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # bootstrap runs as the superuser; goose runs as the migrator; the smoke suite then
      # connects as invoice_app (never the superuser — BYPASSRLS would void the guarantees).
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/invoice_os?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://invoice_migrator:migrator@localhost:5432/invoice_os?sslmode=disable
      DATABASE_URL: postgres://invoice_app:app@localhost:5432/invoice_os?sslmode=disable
      # M5-06: internal/reconciliation's suite also connects as invoice_tenant_reader
      # (tenant enumeration) — same DSN shape as the `rls` job above.
      DATABASE_READER_URL: postgres://invoice_tenant_reader:reader@localhost:5432/invoice_os?sslmode=disable
      MIGRATOR_PASSWORD: migrator
      APP_PASSWORD: app
      READER_PASSWORD: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Bootstrap non-superuser roles (as superuser; psql is preinstalled on the runner)
        run: make db-bootstrap
      - name: Apply all migrations (as migrator)
        run: make migrate-up
      - name: Run the queue smoke + exactly-once suites (as invoice_app) + per-test visibility & skip gate
        # -count=1 disables the test cache: the suites MUST re-run against this fresh DB. No
        # -run filter, so new tests in ./internal/submission are picked up automatically;
        # each DB-backed test self-skips without its DATABASE_* URLs.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/submission/...
      - name: Run the reconciliation sweep suite (as invoice_app + invoice_tenant_reader) + per-test visibility & skip gate
        # M5-06: proves the "who watches the watcher" sweep (Scan/ReArmPoll/audit +
        # SweepOnce's per-tenant orchestration) against a real Postgres. Needs all four
        # DATABASE_* URLs, all already in this job's env; each DB-backed test self-skips
        # without them, so a missing DSN silently SKIPping is turned into a failed step here.
        run: scripts/ci/rls-test-gate.sh -count=1 -run TestRLS ./internal/reconciliation/...

  # M2-10 audit suite: proves audit_log rows are append-only (UPDATE/DELETE/TRUNCATE rejected
  # for the app by the missing grant and for the table owner by the append-only trigger) and
  # commit/roll back atomically with the caller's transaction. Bootstraps roles and migrates
  # exactly like the `migrations`/`rls`/`queue` jobs (creating the committed audit_log table),
  # then runs ./internal/audit as invoice_app; the owner-immutability case also needs
  # DATABASE_MIGRATION_URL (already set below) to attack as invoice_migrator. The suite SKIPS
  # itself without both DATABASE_* URLs, so the `go` job and a bare `go test ./...` stay green.
  audit:
    name: Audit suite (append-only + atomicity)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # bootstrap runs as the superuser; goose runs as the migrator; the suite then connects
      # as invoice_app (writes + grant/RLS attacks) and invoice_migrator (the owner attack).
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/invoice_os?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://invoice_migrator:migrator@localhost:5432/invoice_os?sslmode=disable
      DATABASE_URL: postgres://invoice_app:app@localhost:5432/invoice_os?sslmode=disable
      MIGRATOR_PASSWORD: migrator
      APP_PASSWORD: app
      READER_PASSWORD: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Bootstrap non-superuser roles (as superuser; psql is preinstalled on the runner)
        run: make db-bootstrap
      - name: Apply all migrations (as migrator)
        run: make migrate-up
      - name: Run the audit immutability/atomicity suite (as invoice_app / invoice_migrator) + per-test visibility & skip gate
        # -count=1 disables the test cache: the suite MUST re-run against this fresh DB. No
        # -run filter, so new tests in ./internal/audit are picked up automatically; each
        # DB-backed test self-skips without its DATABASE_* URLs.
        run: scripts/ci/rls-test-gate.sh -count=1 ./internal/audit/...

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-setup reads the pinned pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
      - name: Unit tests (api-client)
        run: pnpm --filter @invoice-os/api-client test
      - name: Unit tests (app)
        run: pnpm --filter @invoice-os/app test
      - name: Unit tests (ops-console)
        run: pnpm --filter @invoice-os/ops-console test
      - name: Unit tests (landing)
        run: pnpm --filter @invoice-os/landing test
      # Shipped with 50 tests and no runner: this SPA appeared nowhere in this file
      # until 2026-08-13. workspaceCoverage.test.ts now fails when the next package
      # arrives the same way.
      - name: Unit tests (support-console)
        run: pnpm --filter @invoice-os/support-console test
      # e2e's *.test.ts files are vitest, not Playwright, so the deploy gate's
      # test:api/topology/smoke/demo jobs never ran them — they had no runner at all
      # until this line. Cheap and deployment-free: they assert local seam logic
      # (requireDbInCI, resolveTarget), not anything about a live environment.
      - name: Unit tests (e2e seams)
        run: pnpm --filter @invoice-os/e2e test:unit

  # Unconditional clean-clone guard (M1-09). The path-filtered go/frontend jobs
  # above only rebuild the half that changed, and the frontend job warms the pnpm
  # store cache — so cross-half rot, a cache-masked lockfile break, an accidentally
  # uncommitted build input (the M1-01 go.mod trap), or a root-file change that
  # matches neither filter can all slip past them. This job always runs, uses no
  # caches, and builds BOTH halves from a fresh checkout — permanently guarding the
  # module-path fix (M1-01) and the workspace collapse (M1-02/03).
  clean-clone:
    name: Clean-clone build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go from scratch — no module/build cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go build ./... (from scratch)
        run: go build ./...
      # All SPAs from scratch — cold pnpm install (deliberately no `cache: pnpm`)
      # so a stale cache can't mask a lockfile that no longer resolves.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm install (cold, frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm -r build (all four SPAs)
        run: pnpm -r build

  # Stale cross-language references (cluster 4 of the QA-log aggregate). The Go
  # compiler and `pnpm -r typecheck` already fail when a renamed symbol strands a
  # caller. Neither can see a STRING that one file produces and another quotes —
  # a Playwright assertion on user-visible copy, a getByTestId, a route in a doc.
  # Those break late (a deploy gate) or not at all.
  #
  # Deliberately NOT behind the `changes` filter: the producer and the stranded
  # consumer are in different halves of the monorepo by definition, so any filter
  # that skips a half is exactly the blindness this job exists to remove.
  #
  # Measured over the 40 most recent merged PRs before it shipped: 0 false
  # failures across 32 PR ranges, and it fires on both breaks the QA logs record
  # (DEMO-01's `AUDIT LOGGED` toast, APPR-15's deleted invite test ids) at the
  # push where each was live.
  stale-refs:
    name: Stale references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the merge base, so a shallow clone would make
          # it silently find nothing — the failure mode it is built to catch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Proves the detector still fires on its pinned known positives before its
      # verdict is trusted. A scan that reports zero because it is broken looks
      # exactly like a scan that reports zero because the branch is clean.
      - name: Prove the detector fires (known positives)
        run: go test ./internal/tools/stalerefs/ -count=1
      - name: Scan for stale references
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit to diff against — nothing to scan."; exit 0 ;;
          esac
          go run ./internal/tools/stalerefs -base "$BASE" -head HEAD

  # A force push after a PR is open for review deletes the commits a reviewer
  # actually read, and leaves the approval pointing at history nobody has seen.
  # Nothing local can catch it: the rewritten commits are gone from the branch,
  # and a subagent's shell commands are not written to the session transcript.
  # GitHub's PR timeline is the only record, so the check has to live here.
  #
  # It is narrow on purpose. Both force pushes this repo has seen (PR #115 on
  # 2026-07-29, PR #140 on 2026-08-06) landed while the PR was still a draft and
  # destroyed nothing, so drafts are left alone. It also clears itself: a fresh
  # review after the rewrite is the actual remedy and turns the check green with
  # no file to edit and no rule to override.
  #
  # .claude/hooks/guard-git-history.py denies the same push before it leaves the
  # machine. That hook only covers sessions that have it loaded; this covers the
  # repository.
  history-rewrite:
    name: History rewrite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gate asserts an ABSENCE, so it proves it can still decide before its
      # verdict is trusted — the pinned cases include PR #140's real timeline.
      - name: Prove the gate still decides (pinned real timelines)
        run: go test ./internal/tools/forcepushgate/ -count=1
      - name: Check the branch was not force-pushed under a review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR" > pr.json
          # --paginate emits one array per page; --jq '.[]' + jq -s rejoins them
          # into the single array the gate expects. Without this a >100-event
          # timeline decodes as one page and the rest is silently dropped.
          gh api --paginate "repos/${{ github.repository }}/issues/$PR/timeline" --jq '.[]' \
            | jq -s '.' > timeline.json
          go run ./internal/tools/forcepushgate -pr pr.json -timeline timeline.json

  # Single always-running gate. Mark THIS check ("CI") required in branch
  # protection (M1-05): it passes when the triggered jobs pass or are skipped,
  # and fails only when a job that actually ran failed — so path-filtered
  # skips never leave a required check stuck pending.
  ci:
    name: CI
    needs: [changes, go, frontend, clean-clone, migrations, docker-canary, rls, queue, audit, stale-refs, history-rewrite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all triggered jobs to pass
        run: |
          echo "changes:       ${{ needs.changes.result }}"
          echo "go:            ${{ needs.go.result }}"
          echo "docker-canary: ${{ needs.docker-canary.result }}"
          echo "migrations:    ${{ needs.migrations.result }}"
          echo "rls:           ${{ needs.rls.result }}"
          echo "queue:         ${{ needs.queue.result }}"
          echo "audit:         ${{ needs.audit.result }}"
          echo "frontend:      ${{ needs.frontend.result }}"
          echo "clean-clone:   ${{ needs.clean-clone.result }}"
          echo "stale-refs:    ${{ needs.stale-refs.result }}"
          echo "history-rewrite: ${{ needs.history-rewrite.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::'changes' job did not succeed"; exit 1
          fi
          if [ "${{ needs.go.result }}" = "failure" ] || [ "${{ needs.go.result }}" = "cancelled" ]; then
            echo "::error::Go job failed"; exit 1
          fi
          if [ "${{ needs.docker-canary.result }}" = "failure" ] || [ "${{ needs.docker-canary.result }}" = "cancelled" ]; then
            echo "::error::Docker canary build failed"; exit 1
          fi
          if [ "${{ needs.migrations.result }}" = "failure" ] || [ "${{ needs.migrations.result }}" = "cancelled" ]; then
            echo "::error::Migrations job failed"; exit 1
          fi
          if [ "${{ needs.rls.result }}" = "failure" ] || [ "${{ needs.rls.result }}" = "cancelled" ]; then
            echo "::error::RLS isolation suite failed"; exit 1
          fi
          if [ "${{ needs.queue.result }}" = "failure" ] || [ "${{ needs.queue.result }}" = "cancelled" ]; then
            echo "::error::Queue smoke suite failed"; exit 1
          fi
          if [ "${{ needs.audit.result }}" = "failure" ] || [ "${{ needs.audit.result }}" = "cancelled" ]; then
            echo "::error::Audit suite failed"; exit 1
          fi
          if [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "cancelled" ]; then
            echo "::error::Frontend job failed"; exit 1
          fi
          # clean-clone is unconditional (no path filter) — it must actually pass,
          # never merely skip.
          if [ "${{ needs.clean-clone.result }}" != "success" ]; then
            echo "::error::Clean-clone build failed"; exit 1
          fi
          # stale-refs is unconditional for the same reason: a skip here would be
          # indistinguishable from a clean scan.
          if [ "${{ needs.stale-refs.result }}" != "success" ]; then
            echo "::error::Stale-reference scan failed"; exit 1
          fi
          # Skips legitimately: it only runs on pull_request, so a push build has
          # no PR to ask about.
          if [ "${{ needs.history-rewrite.result }}" = "failure" ] || [ "${{ needs.history-rewrite.result }}" = "cancelled" ]; then
            echo "::error::Branch was force-pushed after review — a fresh review clears this"; exit 1
          fi
          echo "All triggered CI jobs passed (skipped jobs are OK)."
